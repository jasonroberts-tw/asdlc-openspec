# Every task this repository runs by name, one table each: `mise run <name>` runs its `run` line
# through a shell, from the directory it is called in (`[task_config]` in `mise.toml`). The hooks
# (`git-hooks.yml`), CI (`.github/workflows/verify.yml`), the session hooks' launcher (`runTask` in
# `scripts/hooks/_shared.mjs`) and every prompt call a task here through `mise run`, and the gates
# read this file through one loader, `scripts/lib/tasks.mjs` (`docs/decisions.md` § D-36).
#
# A task has `run` and, optionally, `description`, each a string with no template in it (`{{`, `{%`
# or `{#`): any other key, or a template, which mise renders before the task runs, makes mise run it
# otherwise than the command every reader sees, so the loader refuses one. Every task here has a
# `description`, a `'''` string saying what it does and what breaks without it, which
# `mise tasks info <name>` prints; no gate holds that yet (asdlc-openspec-16mc). Every pre-push job
# with a glob names this file, so a push that edits only a description runs every pre-push job.
# `README.md` § The tasks gives the tier each runs at. Where a description and the header of the
# script its task runs disagree, the header wins. `package.json` keeps two scripts and no more,
# `prepare`, which `npm ci` runs, and `calculator:serve`, the command the calculator's spec names;
# `check:jobs` holds both lists. Add, rename or remove a task with the `add-task` skill. Sorted by
# code point.

["beads:check"]
description = '''
Refuses an open issue with no label naming where its work lands, an open issue filed
`discovered-from` another with no label `assetLabels` in `tools/policy/vocabulary.json` lists, an
open issue whose type no row of `issueTypes` there names, and an issue citing an identifier that
does not resolve here. Without the second, a found issue drops out of `bd count --by-label` and the
count still reads as complete. Without the third, an issue takes a type no filer was told when to
use. It reads the tracker's database, which a fresh clone in CI does not have.'''
run = "node scripts/check-beads.mjs"

["beads:selftest"]
description = '''
The tracker gate, negative-tested: each refusal over a fixture export and a copy of the committed
policy, read through `BEADS_CHECK_ROOT`, with an undoctored control that must name the fixture's
bead count. It runs no `bd`, so it runs in CI too. Without it the gate could lose a rule, or read
the live tracker when pointed at a copy, and still pass.'''
run = "node scripts/check-beads.mjs --selftest"

["calculator:test"]
description = '''
Runs the test files directly in `apps/calculator/test/` (its `README.md` lists them) with Node's own
test runner: each scenario of the calculator and of its local server is a test named for its ID and
title, under a suite named for its requirement, except the few a browser alone can show, which
`apps/calculator/test/README.md` names. Without it nothing holds the calculator to its specs. It
runs through `scripts/run-tests.mjs`, which also fails the run when its pattern matches no file or a
matched file declares no test, since Node's runner passes both, and when a test's metadata breaks
the convention in the header of `scripts/test-trace.mjs` or a test is one that reader and the runner
do not both see.'''
run = 'node scripts/run-tests.mjs "apps/calculator/test/*.test.js"'

["calculator:test:independent"]
description = '''
Runs every test file under `apps/calculator/test/independent/build/`, the contract tests and
build-time fitness functions the build workflow's test-builder writes, through
`scripts/run-tests.mjs --dir`, with the same refusals as `calculator:test`; while the directory
holds no test it passes and says so. Without it the tests that check the calculator's Binding
Surface independently of the agent that built it would run only inside a build. It runs none of
`independent/verify/`, which the strategy leaves to Verify.'''
run = "node scripts/run-tests.mjs --dir apps/calculator/test/independent/build"

["calculator:test:verify"]
description = '''
Runs every test file under `apps/calculator/test/independent/verify/`, the E2E tests and
Verify-deferred fitness functions the test-builder writes, the same way; while the directory holds
no test it passes and says so. `docs/test-strategy.md` § Build exit criteria runs them at Verify, so
no push or CI step runs it, and `scripts/check-jobs.mjs` names it as an exception; change-verify's
fresh run, `tests:fresh`, runs it in a clone of HEAD. Its `--dir` is also how the trace and
test-inventory gates find those tests, without which they would not count an E2E test toward its
scenario or see one removed, and how the thresholds gate leaves them out of its coverage and
mutation runs.'''
run = "node scripts/run-tests.mjs --dir apps/calculator/test/independent/verify"

["check:jobs"]
description = '''
Holds the hook runner's configuration and the CI workflow to the tasks: every job names a task that
exists in the registry its launcher reads, every task no job runs is declared with its reason, and
every declaration is current and of the right kind. It also holds each task to the files it names: a
`tools/`, `scripts/` or `apps/` path exists as spelled, case included, and a glob matches a file.
And it holds the tasks to one registry: `package.json` keeps `calculator:serve` and `prepare` and no
other script, and `mise.toml` defines no task, includes `tasks.toml` and runs a task where it is
called. Without it a gate can be unwired, a job can stay on a launcher that no longer finds its
task, or a task can name a file that is gone, and nothing says so.'''
run = "node scripts/check-jobs.mjs"

["check:jobs:selftest"]
description = '''
The job cross-check, negative-tested.'''
run = "node scripts/check-jobs.mjs --selftest"

["check:node-floor"]
description = '''
Prints the lowest version on the floor's major line that every package in `package-lock.json`
accepts, beside `package.json` `engines`. Refuses a floor below it, a major line on which no version
satisfies every locked package, and a range form it cannot read, which it names rather than skip.
Without it a lockfile change can lift that version above the floor, or bring a range nothing reads,
and nothing says so until someone runs the check by hand.'''
run = "node scripts/check-node-floor.mjs"

["check:node-floor:selftest"]
description = '''
The Node-floor gate, negative-tested: each range form it reads, over a fixture a misreading would
give another version, and each refusal by its reason, beside the live files as a control.'''
run = "node scripts/check-node-floor.mjs --selftest"

["check:policy"]
description = '''
Refuses a record under `tools/policy/` without its five header fields, a constant without its
`Means` sibling and a `Means` without its constant, a key two records define, a record
`tools/policy/README.md` does not name and any other file in the directory, and `tools/policy.json`
back beside the records. Without it a key lands with no reason beside it, two records give one key
two values and each reader takes one, and a key added to the retired file reaches no reader.'''
run = "node scripts/check-policy.mjs"

["check:policy:selftest"]
description = '''
The policy gate, negative-tested over copies of the live records.'''
run = "node scripts/check-policy.mjs --selftest"

["check:prompts"]
description = '''
Refuses a skill or agent whose first line after its frontmatter is not the sentence `CLAUDE.md`
requires, read out of `CLAUDE.md` so the sentence has one home. Refuses too a prompt over its word
budget, or with none: every skill and agent, `CLAUDE.md`, `AGENTS.md`, the worktree briefing
template, `.beads/PRIME.md` and the string literals of each workflow, each against its row, by path,
in `tools/policy/prompt-budgets.json`. Without it a prompt copied in or written fresh loses the
line, and a prompt grows with every review, and nothing says so.
`node scripts/check-prompts.mjs --counts` prints each prompt's words beside its budget.'''
run = "node scripts/check-prompts.mjs"

["check:prompts:selftest"]
description = '''
The prompt gate, negative-tested against a fixture tree it builds.'''
run = "node scripts/check-prompts.mjs --selftest"

["check:register"]
description = '''
Holds the register's status line, summary table and dates to its entries, in both directions.'''
run = "node scripts/check-register-status.mjs"

["check:register:selftest"]
description = '''
The register gate, negative-tested.'''
run = "node scripts/check-register-status.mjs --selftest"

["check:toolchain"]
description = '''
Holds `mise.toml`, the one home of every tool version, to `mise.lock` and to every other place a
tool could be installed. Each pin is exact, and locked with a URL and checksum for every platform
`toolchainLockPlatforms` names, or, for a `pypi:` tool, by the uv lock under `.mise/locks/` that
`mise.lock` names by its digest. Its directory holds nothing else, and the dev container copies it
into its build beside `mise.toml`. Every workflow's `jdx/mise-action`, pinned by commit, pins the
mise the dev container copies in, each by its digest. No setup action, NodeSource, npm install of
`bd`, `uv tool install`, version `ARG` or other manager's version file installs a tool a second way.
`mise.toml` holds no `[env]`, `[hooks]` or `[tasks]`, no tool option table but a `pypi:` tool's
version and extras, no setting it does not admit, and no template but the one in `[task_config]`'s
`dir`, which runs a task in the directory it is called from. No other mise config is tracked, and
mise reads `mise.toml` as the gate does. Without it a second home comes back and drifts from the pin
unseen.'''
run = "node scripts/check-toolchain.mjs"

["check:toolchain:selftest"]
description = '''
The toolchain gate, negative-tested over copies of the live files, beside five controls.'''
run = "node scripts/check-toolchain.mjs --selftest"

["citations:check"]
description = '''
Resolves every line and section pointer in every tracked text file, and refuses a pointer into a
memory store this repository does not use. Without it a renamed heading leaves pointers that still
look authoritative.'''
run = "node tools/citations/check.ts"

["citations:selftest"]
description = '''
The citations gate, negative-tested: its scanner held to fixtures, and the gate run end to end over
a synthetic tree through `CITATIONS_ROOT`, with exact counts in the control and one break per
doctored copy. Without it the gate can go quietly green over a repository it has stopped reading.'''
run = "node tools/citations/selftest.ts"

["citations:support"]
description = '''
An advisory, never a gate: judges, with a TypeSafe Choice, whether the section a citation names says
what the sentence citing it claims, and prints the citations that fall under the policy's threshold
for a person to read. `--file <path>` limits it to one file, `--dry-run` counts without a call. It
reads `TYPESAFE_API_KEY` and the network. When the key is not set it says so and falls back to an
offline word-overlap check, weaker and printed as such, at `citationSupportOverlapMinShare` in
`tools/policy/tool-settings.json`. Without it a pointer that resolves to prose that does not say
what is claimed passes `citations:check` unread.'''
run = "node tools/citations/support.ts"

["citations:support:selftest"]
description = '''
The advisory, negative-tested over a fixture tree and a stubbed judge: each outcome, what is skipped
and why, a missing key that falls back to word overlap and a failed call that fails and never falls
back, the fallback's share and threshold, and once through the real SDK to a refused loopback
connection. Needs no key. Without it the advisory can swallow a failed call and print a clean report
over a run that judged nothing.'''
run = "node tools/citations/support.selftest.ts"

["code-graph"]
description = '''
Builds the local code graph with graphify into the primary checkout's gitignored `graphify-out/` and
registers graphify's MCP server for it at Claude Code's local scope, which that checkout's worktrees
share. The server is on the harness assessment's combined graph beside it while that records this
build, and on the graph otherwise, as after a build that registers (`docs/decisions.md` § D-28). A
build with `--no-mcp`, or one that fails, leaves the server where it was, and says so. `--code-only`
parses code alone and calls no model; `--force` re-sends every document; `--no-mcp` leaves Claude
Code's configuration alone. It reads the network, a language model and your own Claude plan, so no
job runs it. Without it a graph is refreshed with `graphify update`, which erodes its document layer
(`docs/decisions.md` § D-20).'''
run = "node scripts/code-graph.mjs"

["code-graph:mcp"]
description = '''
Registers the MCP server alone, or leaves a matching registration as it is: on the combined graph
`harness:graph` wrote, while it records the graph beside it, and on the graph otherwise. Run it
after `harness:graph` to serve what it wrote.'''
run = "node scripts/code-graph.mjs --mcp-only"

["code-graph:selftest"]
description = '''
The script, negative-tested against a fixture repository with stub graphify, graphify-mcp, `claude`
and `mise` first on PATH, the stub `mise` naming the graphify-mcp it registers. It covers the stamp
on what a language model made and on nothing the parser made, the withheld API key, the policy's
model, folder and server name, each partial-extraction text graphify prints, a registration left
alone or replaced, the lock, a run under a git hook's exported `GIT_DIR`, and each refusal by its
reason, with an undoctored control. It also holds that the combined graph is registered only while
it records the graph beside it. Without it a reworded graphify warning, or a stamp that misses an
item, passes unseen until a graph erodes.'''
run = "node scripts/code-graph.mjs --selftest"

["counts:check"]
description = '''
Re-derives every value in `count-index.md` from the source the index names for it. The table is
updated from what it reports, never the reverse.'''
run = "node scripts/check-count-index.mjs"

["counts:selftest"]
description = '''
The count-index gate, negative-tested.'''
run = "node scripts/check-count-index.mjs --selftest"

["coupling"]
description = '''
Writes the co-change map, `artifacts/coupling/cochange.json`, through the trunk commit it records,
`throughCommit`: which files the pull requests merged to `main` changed together, read from git
history, with how often, the hub files that change with nearly everything, and the clusters of files
that move as one. It never moves that commit, so it writes the same bytes until the emitter or its
keys in `tools/policy/tool-settings.json` change; with no map it refuses. Without it, which issues
can run in parallel lanes, and where a decomposition would cut, are argued from memory of what
changed together. No job runs it: `coupling:check` is its gate.'''
run = "node tools/coupling/coupling.ts"

["coupling:check"]
description = '''
Re-derives the map and refuses any difference, any other file under `artifacts/coupling/`, a
`throughCommit` off `origin/main`'s first-parent chain, a merge commit on it, a shallow clone, and a
`coupling*` key missing or malformed. It prints how many pull requests landed after the baseline,
and does not fail on them. Without it a hand-edited map, or one an edit to its emitter left behind,
reads as current.'''
run = "node tools/coupling/coupling.ts --check"

["coupling:selftest"]
description = '''
The co-change gate, negative-tested: each refusal on a doctored copy of a fixture repository built
from the ratified history, its reason asserted beside a control. It also holds the history walk to
its hand-ratified fixture, each command's refusal to check or write when a walk disagrees with it,
and the command line through `COUPLING_ROOT`, under an exported `GIT_DIR` and a hostile git
configuration.'''
run = "node tools/coupling/selftest.ts"

["coupling:update"]
description = '''
Moves the map's baseline to `origin/main`, and writes the map through it. Run it after
`git fetch origin main`, when the map lags the trunk by more than its reader will accept. No job
runs it, since a job that did would move the baseline it holds.'''
run = "node tools/coupling/coupling.ts --update"

["gate-summary:selftest"]
description = '''
The Stop and SubagentStop hook, run as Claude Code runs it over scratch trees: an untracked file
with a broken pointer must turn its verdict to FAIL for that reason, an ignored one must not, and a
subagent's verdict must say so. A copy of the hook in a scratch repository must run its gates in the
linked worktree the payload's `cwd` names, and its verdict must say what that worktree's own gate
read. A copy of `block-generated-edit.mjs` must refuse an edit to generated output in a linked
worktree with the reason it gives in the primary checkout. Without it the hook could go back to
reporting PASS over files it never read, or over a checkout it never gated, and the edit hook to
passing every generated file in a worktree.'''
run = "node scripts/hooks/gate-summary.selftest.mjs"

["gates"]
description = '''
The forced full pre-push suite, run through `git hook run` with the branch's push line, so it sees a
real push's environment and input. It refuses a clone whose hooks are not installed, and a Git older
than 2.54.0, rather than report a clean run that ran nothing.'''
run = "node scripts/git-hooks.mjs --gates"

["harness"]
description = '''
Writes a dated report of the harness under `.scratch/harness/`, from committed files and the
co-change map. It names each hook job whose glob misses one of its inputs, by kind; each gate a
README table names that nothing runs; each script that runs at pre-push or in CI but not both,
undeclared; and code files that change together and import neither way. Its tables give the rule
sections scripts cite and, per file, the jobs that declare it, the jobs whose imports reach it, how
often pull requests change it and how many globbed jobs that fires per hundred pull requests. Each
item is a finding, a lead or a note, under a stable key, and the report names what changed since the
last one and whether the tool did. It reports and enforces nothing. Without it a glob that misses an
input is found when the job it should have run is first needed.'''
run = "node tools/harness/harness.ts"

["harness:graph"]
description = '''
After `harness`, for the same date: the local code graph's freshness, the graph's own leads, the
co-change pairs with no edge between them in the graph, and the map's clusters against the graph's
communities. It writes one combined graph, the local graph with the harness's wiring and the
co-change edges added. Run from the checkout that holds the graph, it writes it beside the graph,
where `code-graph:mcp` then serves it to sessions; from a worktree, or with `--graph`, beside its
report, not served. With no graph it says so and exits 0. Run under graphify's own Python, it also
loads that graph through graphify's loader and reports an edge lost.'''
run = "python tools/harness/graph.py"

["harness:selftest"]
description = '''
The core over fixture repositories, one planted gap per case, the keys it adds and their reasons
asserted beside a control that reports nothing; the command line through `HARNESS_ROOT`; then the
graph half over fixture graphs, through the `python` that `mise.toml` pins, which fails, saying so,
where none runs.'''
run = "node tools/harness/selftest.ts"

["hooks:install"]
description = '''
Writes the five `hook.asdlc-*` entries into the repository's config, the same from any checkout, and
removes lefthook's shims from `.git/hooks`; it reports a `.old` or `.backup` file and a tracker
section it leaves. `npm ci` runs it through `prepare`; run it by hand after an install that skipped
scripts. Without it no commit or push here runs a gate. It refuses a Git older than 2.54.0, under
which the entries run nothing.'''
run = "node scripts/git-hooks.mjs --install"

["hooks:selftest"]
description = '''
The hook runner, negative-tested: each refusal of the job file and the policy over a doctored copy,
and commits, pushes, a linked worktree, the install, `mise run gates`, an older Git and a signal
through real Git in scratch repositories with a bare remote, beside a control commit and push.
Without it a glob the runner misread, or a skip it did not print, would read as a pass.'''
run = "node scripts/git-hooks.mjs --selftest"

["openspec:check"]
description = '''
Validates every living spec and active change under `openspec/` strictly with the pinned CLI, and
trial-archives each active change into a scratch copy so a delta that cannot merge is refused before
Finalize. It refuses a living spec still carrying the archive's placeholder Purpose, a scenario or
NFR requirement without a unique ID carrying its capability's prefix (`specIdPrefixes` in
`tools/policy/vocabulary.json`), and an ID an archived change gave another title. It refuses, too, a
retired `openspec-*` skill that `openspec init` or `openspec update` wrote back, and a skill or
agent that spells the change label without citing its one home, `specChangeLabel` in
`tools/policy/vocabulary.json`.'''
run = "node scripts/check-openspec.mjs"

["openspec:selftest"]
description = '''
The OpenSpec gate, negative-tested against a fixture tree it builds.'''
run = "node scripts/check-openspec.mjs --selftest"

["pr-review:check"]
description = '''
Holds the pull-request reviewer's four files to each other. The policy's `prReview*` keys must be
whole, with a floor that covers the reviewer itself, the branch reviewer, the approval-label guard
with the helper it imports, and what the merging job imports. `pr-review.yml` must queue rather than
cancel, wake on `verify`'s runs and filter on the policy's approval label, and the branch reviewer
must read only. Each job of `pr-review.yml` runs one subcommand and only what its allowlist names:
its actions and their inputs, its commands, its variables and its tools from mise. So it refuses a
language model, a package in the job that merges, and a command or shell of a step's own. It
refuses a secret however it is read, an OIDC token, `write-all` included, and an expression
interpolated into a shell. It refuses an evidence job without a read-only token of its own, and a
shallow history where the evidence is computed or the merge made. It refuses a `verify.yml` without
the required check or a dispatch trigger. Without it a renamed label or check leaves approvals and
merges waiting on the schedule, and nothing says why.'''
run = "node scripts/pr-review.mjs --check"

["pr-review:selftest"]
description = '''
Every decision the reviewer makes, over fixtures built from the live policy, each case asserting its
reason. It holds which changes the floor sends to a person and which merge, the floor read from git
objects between two commits and by the trunk's policy, a floor that cannot be computed, which
approvals count, and what the queue takes next. It holds that a merge goes by the floor recomputed
when it is made, never by a comment, which another workflow could forge, and that a merge verdict
that floor does not bear out is replaced by the floor's, so the queue stops choosing it. It holds
how the verdict prints and cuts its evidence, and that nothing in a path, a reason or the evidence
forges a verdict.
It holds which heads `mark` sets pending when the session that opened the pull request, or a
person, runs it. It holds the local brief's facts too: which other issues the cited issues and the
body name, that the prompt counts come from the commit and not the working tree, when they are
shown and that a failed count always is, how the commits read, and what `brief --local` refuses as
its inputs. It also runs the wiring gate over doctored copies with an undoctored control. Without
it a change to the decisions shows only in a merge nobody meant.'''
run = "node scripts/pr-review.mjs --selftest"

["tests:fresh"]
description = '''
The verifier's fresh run, from a change's worktree (`change-verify` § 4): it clones HEAD under the
temporary directory with the worktree's `origin/main` and no remote, runs `npm ci`, every test
script, the trace gate and `thresholds:commands:check` there, sorts each test by the traceability
record, and writes `.scratch/<change>-verify.json`, which the trace workflow and the verification
report read. `--rerun` runs one failing test once more, by name, in a fresh clone. Without it Verify
runs the proofs in a worktree whose leftover state a test can pass on, and a flaky test can be
retried until green. It reads the network through `npm ci`, so no job runs it.'''
run = "node scripts/fresh-run.mjs"

["tests:fresh:selftest"]
description = '''
The fresh run, negative-tested over a fixture repository with `npm ci` stubbed: the clone is of
HEAD, with the checkout's `origin/main` and no remote, and is removed; a dirty tree, a temporary
root inside a repository, a missing `origin/main` and a failed install are refused by their reasons.
It holds, too, that a test the record lacks is a problem of the run, a test citing a task passed in
joins the change's partition, and a failing test is run once more by name, once. Without it the
stand-in for a run no job can make would not exist.'''
run = "node scripts/fresh-run.mjs --selftest"

["tests:inventory:check"]
description = '''
Compares the tests at HEAD with those at its merge base with `origin/main`, read from git, and
refuses a test removed, one given a skip, a todo or an only, and one with fewer assertions, unless a
commit on the branch records an architect's decision for it in a trailer, the key
`testInventoryTrailer` in `tools/policy/vocabulary.json`. A test renamed with its call unchanged and
every ID of its old name kept is not a removal, and on `main` it passes. Without it a builder can
turn a failing run green by deleting, skipping or weakening the test, and every other gate stays
green.'''
run = "node scripts/check-test-inventory.mjs"

["tests:inventory:selftest"]
description = '''
The test-inventory gate, negative-tested: each refusal over doctored copies of a fixture's test
files, with a control whose assertions and skips are counted by hand, and through git over fixture
repositories, among them a decision in the wrong paragraph of a commit message or with its key in
another case, a shallow clone and one with no `origin/main`. Without it the gate could let a rename
drop a test's ID, miss a kind of skip, count assertions in a comment, or read the working tree
instead of the commits, and still pass.'''
run = "node scripts/check-test-inventory.mjs --selftest"

["tests:selftest"]
description = '''
The test runner behind `calculator:test`, `calculator:test:independent` and
`calculator:test:verify`, negative-tested against fixture trees it builds: it must refuse a matched
file that declares no test, a pattern that matches no file and a `--dir` that is not a directory,
pass a `--dir` that holds no test yet only saying so, and still fail a failing test, at any depth
under a `--dir` too. It must refuse too a test with no trace line, a test made in a loop or inside
another test's body, which the reader cannot see, a test under a condition, which the runner never
registers, and a policy without the reader's keys. By `--name` it must run exactly one test of that
name, refusing a name that runs none or two. Without it the runner could go back to passing a run
that tested nothing, as Node's own runner does, or let a test run that a gate reading tests from
source never counts.'''
run = "node scripts/run-tests.mjs --selftest"

["tests:trace:selftest"]
description = '''
The test-trace reader, `scripts/test-trace.mjs`, negative-tested: each refusal of a test's name or
`// trace:` metadata on a doctored copy of a source, with a control read field by field, a name's
escapes read as JavaScript reads them and a commented-out test left unread, and `cite` refusing a
ref no trace line carries. It holds the reader's hash, too, over a fixture spec tree, where the
control is the sha256 of the text the definition names. A requirement's statement or a scenario's
own block moves a hash; a blank line, a sibling or a renamed requirement does not, and an archive by
the pinned OpenSpec CLI moves none. Without it the convention could be read wrong, or a hash go
stale on an edit that changes nothing a test proves, and every gate that reads tests through it
would agree.'''
run = "node scripts/test-trace.mjs --selftest"

["thresholds:check"]
description = '''
Runs every test file but those of the test-builder's Verify stage once with Node's own coverage. It
holds the code lines and branches a branch changes under `apps/`, against its merge base with
`origin/main`, to the thresholds and minimum samples in `tools/policy/tool-settings.json`, and
prints the whole product's figures beside them, ungated. Then StrykerJS's tap runner mutates the
changed lines of the Routines over the same tests, and it holds their mutants to the mutation
threshold. A change to a test alone mutates nothing. It holds the ratchet baseline,
`artifacts/thresholds/baseline.json`, to the one at the merge base, carried through the branch's
edits. Below a minimum sample it gives the counts and no rate, and refuses any one gap a directive
does not excuse with a reason. Without it a change can land code no test runs, or tests that run it
and detect nothing, and every other gate passes.'''
run = "node scripts/check-thresholds.mjs"

["thresholds:commands:check"]
description = '''
Has StrykerJS's command runner mutate the changed lines of the Commands, the files
`mutationCommands` in `tools/policy/tool-settings.json` names, one mutant at a time, and holds their
mutants as `thresholds:check` holds the Routines'. It is no pre-push job, for its minutes of cost,
which the header of `scripts/check-thresholds.mjs` gives; `tests:fresh` runs it too, at
`change-verify`, and the verification report carries its output. Without it code the tests reach
only by spawning a process is never scored, since the tap runner cannot see it.'''
run = "node scripts/check-thresholds.mjs --commands"

["thresholds:selftest"]
description = '''
The thresholds gate, negative-tested over a fixture repository laid out as the calculator is and
sized from the live policy's minimum samples: each refusal of coverage, of the Routines' and the
Commands' mutants and of the baseline asserted with its reason beside two controls, the baseline's
update, and the command line through `THRESHOLDS_ROOT`. It holds, too, that the test-builder's
Verify stage runs in neither the coverage run nor the Routines' mutation run. Without it a threshold
could stop being read, or a gap stop being refused, and the gate still pass.'''
run = "node scripts/check-thresholds.mjs --selftest"

["thresholds:update"]
description = '''
Carries the ratchet baseline, `artifacts/thresholds/baseline.json`, from the merge base through the
branch's edits: it re-keys each entry to where its code now sits, drops each on a line the branch
changes, which the branch answers for, mutates the lines of the rest and drops each a test now
detects. On the branch that creates the baseline it mutates the whole product and lists the
undetected mutants of each run below its threshold; it adds none after that. No job runs it, since a
job that did would move the baseline it holds.'''
run = "node scripts/check-thresholds.mjs --update"

["trace"]
description = '''
Writes the traceability record, `artifacts/trace/record.json`, and the directory's `README.md`:
every scenario and NFR requirement of the living specs and the active deltas, with its tests by role
and its obligation; every test, with each reference it cites and whether that is current; every
contract operation; and every task a commit on HEAD names, with the paths under `apps/` it changed.
Without it Verify has no record to sort a change's tests from the regression suite by, and a
scenario's proof is traced by hand. A commit joins the record only once it exists, so it runs after
the last commit that changes `apps/`. No job runs it: `trace:check` is its gate.'''
run = "node tools/trace/trace.ts"

["trace:check"]
description = '''
Re-derives the record and its README and refuses any difference, or any other file under
`artifacts/trace/`. It holds the rules the header of `tools/trace/trace.ts` gives, refusing a commit
of the branch that changes `apps/` and names no task, a contract operation with no contract test, a
test with no ID or no artifact hash, an ID nothing heads, and a hash that is not current. It
refuses, too, a scenario with no happy-path or no negative test at the functional layer or above
that the baseline does not list, and holds the baseline itself, which may fall and never rise.
Without it a scenario can land half-proved, or a test keep proving a scenario its change rewrote.'''
run = "node tools/trace/trace.ts --check"

["trace:selftest"]
description = '''
The trace gate, negative-tested: each refusal on a doctored copy of a fixture repository, its reason
asserted beside a control, the baseline's update, the history walk against its hand-ratified
fixture, and the command line through `TRACE_ROOT`.'''
run = "node tools/trace/selftest.ts"

["trace:update"]
description = '''
Moves the ratchet baseline, `artifacts/trace/baseline.json`, down to the obligations still unmet
that the baseline at the branch's merge base with `origin/main` lists. It adds none, and prints each
it would not add, which the change then meets. No job runs it, since a job that did would move the
baseline it holds.'''
run = "node tools/trace/trace.ts --update"

["vale:selftest"]
description = '''
This repository's own Vale style, `.vale-styles/Layout/`, over fixtures: a control holding every
construct its rules must pass draws no alert, and each doctored case draws exactly its rule's alert
at its line; every section of `.vale.ini` that lints with a style applies it, and one with the style
taken out is refused by name. It runs the `vale` mise installs, in CI too, and skips clean where
none is on PATH; a `vale` that is found and fails is a failure, which it holds by running itself
with a failing stub. Without it a rule that stops matching leaves the hook silent over the fault it
names.'''
run = "node scripts/vale.selftest.mjs"

["workflows:selftest"]
description = '''
Runs each workflow under `.claude/workflows/` against stubbed agents with the values in
`tools/policy/agent-workflows.json`. For the change-build review, `build-change-task.js`: how it
stops, how many skeptics it sends a finding, that a finding nobody could verify is never counted
refuted, and that it reports a listener it left behind. It must stop as `not-red`, before any
review, a task of a kind `buildRedFirstKinds` lists when a scenario the parent named has neither a
red record nor an already-green report, and no task of another kind. For a task of a kind
`buildIndependentKinds` lists, its test-builder must be called by its agent type with a prompt built
from the allowed inputs alone. For such a task it must stop as `not-independent` a builder writing
under the test-builder's directory, a test-builder file outside it or under the wrong stage (an E2E
test or a Verify-deferred fitness function under `build/`), or a runner that leaves one behind. For
such a task it must run every build-stage file an earlier task committed beside the task's own,
where it stands and never written, and route each failure, an earlier file's included, to
rewrite-test, fix-app or re-design. It must stop such a task on a re-design its skeptics uphold and
on tests still failing at the last run, and let no planted test source, assertion or stack frame
reach its builder's or fixer's prompt. `.claude/agents/test-builder.md` must have no tool but its
structured output. For the prompt review, `review-prompts.js`: that it refuses a finding below the
threshold, sends each edit the skeptics its severity is given and each consolidation the `blocker`
count, refuses a consolidation that does not say where each removed rule went, merges no branch a
majority did not uphold, and returns every finding it read and did not carry, to be held. It also
keeps out a branch that turns a stored decision case of a file it changes from right to wrong, or
leaves one unanswered. For its cases, `author-prompt-cases.js`: that it sends one author per lens,
shown its own seed alone, stores a case only when every answer chose its expected option, and
refuses a reader's copy its checksum does not match or a path other than where its command writes.
Every case under `.claude/prompt-cases/` must pass both workflows, which give one case one answer
prompt. Each workflow's reader must be given one plain run of `scripts/prompt-case-texts.mjs` that
names no git, which Claude Code runs in the review's worktree, and that command, run for real in a
fixture repository, must send each author and answer to the text git holds at its ref.
`prompt-case-author.md` and `prompt-case-answerer.md` may have no tool but Read and their structured
output. For the change-verify trace, `verify-change-trace.js`: that it counts no group its tracer
returned short or read at another commit, gives each row its gap from its reading, never counts an
unverified gap refuted, and never lets a skeptic's vote clear a proof that failed. It must keep on a
run again only the readings it is given, of lenses that read, take each row's result from the fresh
run, counting a flaky test as failing, and refuse a run of another commit. The trace and
pull-request-body renderers must refuse a result with a scenario missing, a gap open or a row that
did not pass. The verification report's two renderers must write one section from one stubbed run,
and reject on a flaky or failing test, an unmet obligation or a failed Commands' run. It also holds
each file to what the Workflow runtime accepts, and refuses a workflow with no suite. Without it a
wrong stop rule shows only in a real run, at millions of tokens.'''
run = "node scripts/workflows.selftest.mjs"

["worktree:gc"]
description = '''
Removes a clean checkout with no process in it once HEAD there has been still for
`worktreeGcMinAgeHours`, or at once when `--finished <name>` names it. It deletes an agent branch
only on proof its content is in the trunk, a merged pull request's head among the proofs;
`--dry-run` prints what it would do.'''
run = "node scripts/prune-worktree-branches.mjs"

["worktree:selftest"]
description = '''
The worktree hooks, the git guard and the branch sweep, negative-tested against a scratch repository
it builds, and the worktree briefing rendered from its template into a scratch directory.'''
run = "node scripts/hooks/worktree-hooks.selftest.mjs"
