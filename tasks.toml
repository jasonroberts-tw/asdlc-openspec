# Every task this repository runs by name, one table each: `mise run <name>` runs its `run` line
# through a shell, from the directory it is called in (`[task_config]` in `mise.toml`). The hooks
# (`git-hooks.yml`), CI (`.github/workflows/verify.yml`), the session hooks' launcher (`runTask` in
# `scripts/hooks/_shared.mjs`) and every prompt call a task here through `mise run`, and the gates
# read this file through one loader, `scripts/lib/tasks.mjs` (`docs/decisions.md` § D-35).
#
# A task has `run` and, optionally, `description`, each a string: any other key makes mise run it
# otherwise than the command every reader sees, so the loader refuses one. `package.json` keeps two
# scripts and no more, `prepare`, which `npm ci` runs, and `calculator:serve`, the command the
# calculator's spec names; `check:jobs` holds both lists. Add, rename or remove a task with the
# `add-task` skill. Sorted by code point.

["beads:check"]
run = "node scripts/check-beads.mjs"

["beads:selftest"]
run = "node scripts/check-beads.mjs --selftest"

["calculator:test"]
run = 'node scripts/run-tests.mjs "apps/calculator/test/*.test.js"'

["calculator:test:independent"]
run = "node scripts/run-tests.mjs --dir apps/calculator/test/independent/build"

["calculator:test:verify"]
run = "node scripts/run-tests.mjs --dir apps/calculator/test/independent/verify"

