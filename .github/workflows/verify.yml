# Every gate, binding on every pull request and on every push to the trunk: the slowest tier of the
# gate ladder (`CLAUDE.md` § The gate ladder), and the one that trusts none of the faster ones.
#
# kit 1.6-5 · ADAPT: keep the order CHEAPEST FIRST, so the commonest failure is also the quickest
# answer. A step belongs here when its check reads only committed files; a check that reads
# something outside the repository (another checkout, a token, a network, a language model) belongs
# in neither this file nor the hook runner's, and its selftest over fixtures is a step here in its
# place (`docs/decisions.md` § D-15). Delete this paragraph when done.
name: verify

on:
  pull_request:
  push:
    branches: ['main']
  # The reviewer's merges (`.github/workflows/pr-review.yml`) are made with a workflow token, and an
  # event that token causes starts no workflow run, so no push run follows them. The reviewer
  # dispatches this workflow on `main` after each one instead, which keeps it binding on every push.
  workflow_dispatch:

# A newer run for the same ref supersedes an older one: cancel it rather than queue behind it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Minimal: every step below only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step fails the run in minutes rather than holding a runner for the default six hours.
    timeout-minutes: 15
    steps:
      # The whole history, not the default single commit: `trace:check` walks every commit on HEAD
      # for the tasks its record links, and measures the branch from its merge base with
      # origin/main, which a shallow clone has neither of (the header of tools/trace/trace.ts). The
      # test-inventory gate compares HEAD with that same merge base, and fails rather than pass in a
      # shallow clone (the header of scripts/check-test-inventory.mjs). `coupling:check` reads the
      # trunk's history through the commit its map records, and holds that commit to origin/main
      # (the header of tools/coupling/coupling.ts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Milliseconds: three committed files held to each other.
      - name: every job names a script, and every unjobbed script is declared
        run: npm run check:jobs
      - name: the job cross-check, negative-tested
        run: npm run check:jobs:selftest
      # Seconds (git-hooks.yml's `hooks-selftest` job has the measurement): the git hook runner's
      # refusals over doctored copies, and commits, pushes, a linked worktree, the install and
      # `npm run gates` through real Git in scratch repositories under the temporary directory. The
      # runner refuses a Git older than 2.54.0; the runner image's was 2.55.0 (its image 20260920).
      - name: the git hook runner, negative-tested
        run: npm run hooks:selftest
      # Milliseconds: CLAUDE.md, the prompts, the workflows' string literals and the word budgets in
      # tools/policy.json.
      - name: every skill and agent opens with the line CLAUDE.md requires, and every prompt is within its word budget
        run: npm run check:prompts
      - name: the prompt gate, negative-tested
        run: npm run check:prompts:selftest
      # Milliseconds: each workflow under `.claude/workflows/` against stubbed agents, with the policy's
      # review sizes, prompt-review threshold and skeptic counts.
      - name: the workflows stop, confirm and report as their policy says
        run: npm run workflows:selftest
      # Milliseconds: the reviewer's wiring and its decisions, with the policy's values. The reviewer
      # itself reads a token and a language model, and runs only as `pr-review.yml`.
      - name: the reviewer's workflow, agent and policy agree
        run: npm run pr-review:check
      - name: the reviewer's decisions, and its wiring gate, negative-tested
        run: npm run pr-review:selftest
      # Milliseconds: the count index held to the committed files its own second table names.
      - name: every count in the index re-derives from its source
        run: npm run counts:check
      - name: the count-index gate, negative-tested
        run: npm run counts:selftest
      # Every tracked text file, no allowlist.
      - name: every citation resolves
        run: npm run citations:check
      # Synthetic fixtures, and scratch git trees under the temporary directory for the end-to-end cases.
      - name: the citations gate, negative-tested
        run: npm run citations:selftest
      # About two seconds: the advisory `citations:support` over a fixture tree and a stubbed judge,
      # and the real SDK against a refused loopback connection. The command reads a token and the
      # network and runs here only as this selftest.
      - name: the citation-support advisory, negative-tested over a stubbed judge
        run: npm run citations:support:selftest
      # About a second (git-hooks.yml's `gate-summary-selftest` job has the measurement): the Stop
      # hook over scratch citation trees and scratch repositories under the temporary directory.
      - name: the Stop hook reads untracked files and places a subagent's checkout, negative-tested
        run: npm run gate-summary:selftest
      # Milliseconds: the register's header held to its own headings.
      - name: the register's header agrees with its entries
        run: npm run check:register
      - name: the register gate, negative-tested
        run: npm run check:register:selftest
      # Under a second (git-hooks.yml's `beads-selftest` job has the measurement): a fixture export
      # and a copy of the policy under the temporary directory, read through `BEADS_CHECK_ROOT`,
      # with no `bd`. The gate it tests reads the tracker, so it is absent below.
      - name: the tracker gate, negative-tested over a fixture export
        run: npm run beads:selftest
      # Seconds: the pinned OpenSpec CLI, one start per run plus one per active change; no network.
      - name: every living spec and active change is valid, and every change applies
        run: npm run openspec:check
      # Seconds, more than the OpenSpec check and less than its selftest (the cost note on
      # git-hooks.yml's `calculator-test` job has the measurement): Node's own test runner over
      # `apps/calculator/test/`, each test named for the IDs it proves, its `// trace:` metadata read
      # and held to what the runner reports, and no matched file without a test.
      - name: the calculator's scenarios pass
        run: npm run calculator:test
      # Under a second while it holds no test (git-hooks.yml's `calculator-test-independent` job has the
      # measurement): the test-builder's contract tests and build-time fitness functions under
      # `apps/calculator/test/independent/build/`, held as the step above holds the rest. Its E2E
      # tests and Verify-deferred fitness functions run at Verify, and no step here runs them.
      - name: the calculator's independent tests pass
        run: npm run calculator:test:independent
      # Under a second (git-hooks.yml's `tests-selftest` job has the measurement): fixture trees
      # under the temporary directory, one Node process per fixture test file.
      - name: the test runner, negative-tested
        run: npm run tests:selftest
      # Seconds (git-hooks.yml's `tests-fresh-selftest` job has the measurement): the verifier's fresh
      # run over a fixture repository, its `npm ci` stubbed. `tests:fresh` itself reads the network
      # and runs only in change-verify (docs/decisions.md § D-15, item 3).
      - name: the verifier's fresh run, negative-tested
        run: npm run tests:fresh:selftest
      # Seconds (git-hooks.yml's `code-graph-selftest` job has the measurement): the code-graph
      # script over a fixture repository, graphify, its MCP server and claude stubbed. `code-graph`
      # itself reads a language model and the person's plan, so no step runs it.
      - name: the code-graph script, negative-tested over stub tools
        run: npm run code-graph:selftest
      # Under a second (git-hooks.yml's `tests-trace-selftest` job has the measurement): doctored
      # test sources, a fixture spec tree under the temporary directory, and one archive by the
      # pinned OpenSpec CLI, with no network.
      - name: the test-trace reader and its hash, negative-tested
        run: npm run tests:trace:selftest
      # Under a second (git-hooks.yml's `trace-check` job has the measurement): the traceability
      # record re-derived and diffed, and every rule its header holds, over the branch's commits since
      # its merge base with origin/main, which the whole-history checkout above provides.
      - name: the traceability record is current, and every scenario, test, contract and task holds to it
        run: npm run trace:check
      # About ten seconds (git-hooks.yml's `trace-selftest` job has the measurement and the count of
      # trial archives): fixture repositories under the temporary directory, and trial archives by
      # the pinned CLI.
      - name: the trace gate, negative-tested
        run: npm run trace:selftest
      # Under a second (git-hooks.yml's `coupling-check` job has the measurement): the co-change map
      # re-derived through the trunk commit it records, which the whole-history checkout above holds,
      # and that commit held to origin/main.
      - name: the co-change map is current through its baseline, and the baseline is on the trunk
        run: npm run coupling:check
      # About ten seconds (git-hooks.yml's `coupling-selftest` job has the measurement): fixture
      # repositories under the temporary directory, and the command line run against them.
      - name: the co-change gate, negative-tested
        run: npm run coupling:selftest
      # A Python 3 for the harness's graph half, which `scripts/python.mjs` launches and fails
      # without, as its header says, rather than skip; pinned to one minor release.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Seconds (git-hooks.yml's `harness-selftest` job has the measurement): the harness
      # assessment's core over fixture repositories, then its graph half over fixture graphs. The two
      # commands write a local report or read the local code graph, so no step runs them
      # (docs/decisions.md § D-26).
      - name: the harness assessment, negative-tested over fixtures
        run: npm run harness:selftest
      # Under a second (git-hooks.yml's `tests-inventory` job has the measurement): the tests at HEAD
      # against those at its merge base with origin/main, read from git. On a push to main HEAD is
      # its own merge base, and it passes; on a pull request HEAD is the merge commit.
      - name: no test removed, skipped or weakened without an architect decision
        run: npm run tests:inventory:check
      # Seconds (git-hooks.yml's `tests-inventory-selftest` job has the measurement): fixture
      # repositories under the temporary directory.
      - name: the test-inventory gate, negative-tested
        run: npm run tests:inventory:selftest
      - name: the OpenSpec gate, negative-tested
        run: npm run openspec:selftest
      # About twenty-five seconds (git-hooks.yml's `thresholds-selftest` job has the measurement): a fixture
      # repository under the temporary directory, with StrykerJS's tap and command runners.
      - name: the thresholds gate, negative-tested
        run: npm run thresholds:selftest
      # Seconds, and more as more Routine lines change (git-hooks.yml's `thresholds-check` job has the
      # measurement): the suite once with Node's own coverage, and StrykerJS's tap runner over the
      # changed lines of the Routines, from the merge base with origin/main that the whole-history
      # checkout above provides.
      - name: the changed code is covered, and the changed Routines' mutants detected, to the policy's thresholds
        run: npm run thresholds:check
      # Last, as the slowest: up to minutes when a Command's code changed, and under a second
      # otherwise. StrykerJS's command runner, one mutant at a time, over each Command's changed
      # lines. It is no pre-push job, an exception to the gate ladder that `docs/decisions.md` § D-04
      # records in its amendment of 2026-09-29, for the cost the header of
      # scripts/check-thresholds.mjs gives; change-verify runs it too, in its fresh run (scripts/fresh-run.mjs).
      - name: the changed Commands' mutants are detected, to the policy's threshold
        run: npm run thresholds:commands:check
      #
      # DELIBERATELY ABSENT, each with its reason. Add to this list rather than deleting from it:
      #   * the tracker's checks, `beads:check` and the tracker's own pre-push hook: they read the
      #     tracker's database, which a fresh clone does not have. `beads:selftest` is a step above:
      #     it reads a fixture export and the committed policy, and runs no `bd`.
      #   * the worktree hooks' selftest, `worktree:selftest`: about a hundred git spawns against a scratch repository it
      #     builds; it is a pre-push job, and nothing it reads differs in CI.
      #   * the Vale style's selftest, `vale:selftest`: it runs `vale`, which this runner does not
      #     install, so here it would only ever skip and read green. It is a pre-push job. The style
      #     it tests runs in the vale@agent-tools hook on each edit, never in CI.
      #   * the pull-request review itself: it reads a token, a language model and the tracker, so it
      #     is `.github/workflows/pr-review.yml`, and only its wiring and decisions are steps here.
      #
      # A RETIRED STEP stays here as a comment saying why a restored step would be wrong, so the next
      # person does not restore it:
      #   * `outcomes:record:selftest`, `outcomes:check` and `outcomes:selftest`: the run-outcome
      #     record's writer, the learning loop's reports and its filing step, and each one's
      #     negative test. `docs/decisions.md` § D-06 retired the loop with `tools/outcomes/` and
      #     `artifacts/outcomes/`, which no longer exist, so a restored step fails on a missing
      #     script. The loop's filing step, `outcomes:propose`, was never a step: it read and wrote
      #     the tracker.
      #   * `pipeline:check`, `pipeline:stale:check` and `pipeline:selftest`: the graph record held to
      #     the repository, the digest stamped into each node's output, and both negative-tested.
      #     `docs/decisions.md` § D-15 retired the pipeline with `tools/pipeline/`, whose record never
      #     held a node but the kit's example, so a restored step fails on a missing script. An emitter
      #     that reads only committed files is held by its own `:check` twin, a step of its own.
