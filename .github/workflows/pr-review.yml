# The pull-request reviewer: one pull request at a time, the queue decides its head by the floor
# alone, and the reviewer merges it when no changed path or key is on the floor
# (`docs/decisions.md` § D-07, as § D-37 and § D-46 amend it). `scripts/pr-review.mjs` decides, by
# the `prReview*` keys of `tools/policy/pr-review.json`; no language model and no secret takes part.
# Each changed file's reach and co-change partners are the branch review's, in the brief
# `scripts/pr-review.mjs brief --local` writes before the push; this workflow computes none.
#
# THE INCIDENT. On 2026-10-04 (asdlc-openspec-qcqm) the verdicts on the 41 pull requests merged after
# 003a5f6 showed the model this workflow ran deciding nothing the floor had not: every pull request it
# judged high risk was already high by the floor, and its two requests for changes fell on pull
# requests the floor sent to a person anyway. Until then the review job held an Anthropic workload
# identity, four Actions secrets, an OIDC token and the tracker's CLI, each with an incident of its own
# (`git log -- .github/workflows/pr-review.yml` before D-37); none of them is needed now. The job that
# merges was always kept from the model; then from every npm package too, by an `evidence` job of its
# own that computed reach and co-change with a token that read only. On 2026-10-05
# (asdlc-openspec-m8hs, D-46) that job went: the branch reviewer, the one reader the tables were for,
# already had them in its brief, and the verdict reprinted them for a person. On the run that
# reviewed #154 (37360770831) the three jobs took 65 s from the first start to the last end, 13 s of
# it the evidence job and 21 s the gaps between jobs.
#
# WHAT ELSE IT WOULD LET THROUGH IF IT WERE WRONG. Two runs merging at once would each judge a base the
# other was about to move; a pending run cancelled by a newer one would leave its pull request
# undecided until the schedule; a job that checked out a pull request's head would run that pull
# request's code with this workflow's token; and the harness's or the co-change map's code, which is
# off the floor, run in this job would run beside the token that merges, so a change no person
# approved could merge the next one. So every run that reviews or merges shares one concurrency group
# whose pending runs queue rather than cancel; a run takes one action and re-dispatches itself while
# more are waiting; the one job checks out the trunk and reads a pull request only as git objects; and
# it installs Node and gh and no npm package, imports only files on the floor, and runs `next` and
# then `act` and nothing its allowlist leaves out, no model, no other action and no command of a step's
# own. `pr-review:check` holds each. Where it loses: a run that finds nothing to do holds the token
# that merges too.
#
# INVOCATION. It runs on its triggers. By hand, `gh workflow run pr-review.yml` wakes the queue, and
# `gh workflow run pr-review.yml -f pr=<number>` reviews that pull request again at its head.
# `node scripts/pr-review.mjs next --dry-run`, from any checkout with `gh`, prints what a run would do
# and writes nothing. No job here marks a new head pending: the session that opens a pull request
# does (`.claude/skills/open-pr/SKILL.md` § 5. Push, open, and mark it pending), and a person can:
#
#     PR=<number> node scripts/pr-review.mjs mark
#
# The queue reviews a head that passed `verify` whether or not it was marked. The `mark` job that did
# it on every new head was retired on 2026-09-28 (asdlc-openspec-08a).
#
# NEEDS. Only the run's own `github.token`, the network to GitHub, and Node and gh at the versions
# `mise.toml` pins. No job installs `bd` or an npm package.
# It reads a token and the network, so it is neither a pre-push job nor a `verify.yml` step
# (`CLAUDE.md` § The gate ladder): `pr-review:check` holds its wiring to the policy, and
# `pr-review:selftest` holds every decision, from those tiers.
name: pr-review

on:
  # A verify run finished: a pull request's head may now be reviewable, or `main` green for a merge.
  workflow_run:
    workflows: ['verify']
    types: [completed]
  # A person applied a label, which wakes the queue if it is the approval label. The base branch's copy
  # of this file runs, never the pull request's, and no job checks out its head.
  pull_request_target:
    types: [labeled]
  # The safety net for a wake-up that never came: a merge GitHub was still computing, say.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Review this pull request again at its head, even where it has a verdict'
        required: false
        default: ''

# Any run may review or merge, so every run shares `pr-review-queue`: one runs at a time, and
# `queue: max` keeps each pending run rather than letting the newest cancel it.
concurrency:
  group: pr-review-queue
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  queue:
    # Any label but the approval one is not the queue's business.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.label.name == 'review:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Node and gh, and no npm package: this job imports only files on the floor, so nothing a pull
    # request could change without a person runs with this token.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # A red or conflicting head gets its status, as does every head this job decides.
      statuses: write
      checks: read
      # `verify.yml` on `main` when it has no run or after a merge; while more is waiting, this
      # workflow again.
      actions: write
    steps:
      # The trunk with its whole history, so the merge base of the pull request's head is found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node and gh, the two tools of `mise.toml` this job runs, installed from `mise.lock` and no
      # other: without `install_args` the action installs every pin, `bd` among them. mise itself,
      # the action's commit and its `sha256` are pinned as `verify.yml` says, which
      # `mise run check:toolchain` holds.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          install_args: node gh
      - id: next
        name: choose this run's one action
        run: node scripts/pr-review.mjs next
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PR: ${{ inputs.pr }}
      - name: decide the head from the floor, post the verdict, set the labels and the status, and merge
        if: steps.next.outputs.action != 'none'
        run: node scripts/pr-review.mjs act
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.next.outputs.action }}
          PR: ${{ steps.next.outputs.pr }}
          SHA: ${{ steps.next.outputs.sha }}
          MORE: ${{ steps.next.outputs.more }}
