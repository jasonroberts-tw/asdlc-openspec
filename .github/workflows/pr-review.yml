# The pull-request reviewer: one pull request at a time, Claude Code reviews its head against the
# issues its title cites, and the reviewer merges it when every dimension passes and its risk is not
# high (`docs/decisions.md` § D-07). Claude Code only returns a verdict; `scripts/pr-review.mjs`
# decides what the verdict does, by the `prReview*` keys of `tools/policy/pr-review.json`.
#
# THE INCIDENTS. On 2026-09-25 the review of pull request #47 (run 36191751066) failed before it read
# anything: `bd bootstrap` found no `bd` binary (asdlc-openspec-61t). `@beads/bd`'s postinstall
# downloads the binary only when `CI` is unset, Actions sets `CI=true` on every step, and the install
# exited 0 all the same. The first diagnosis blamed the `allowScripts` warning npm 11.19.0 printed,
# but that warning withholds nothing yet, and its fix, `--allow-scripts` alone, still skipped the
# download when measured with `CI=true`. So the install step unset `CI`, passed `--allow-scripts`
# for the npm that will enforce it, and ran `bd --version` itself, and `pr-review:check` held all
# three. Since 2026-10-03 bd comes through `jdx/mise-action` from its own GitHub release, which has
# no postinstall to skip (docs/decisions.md § D-31), so the first two went with the npm install;
# `bd --version` stays, as a step of its own before `bd bootstrap`, and `pr-review:check` holds
# that and the install.
#
# The same day, the first reviews to reach Claude Code (run 36194854141 and after) failed in the
# action with "--json-schema was provided but Claude did not return structured_output"
# (asdlc-openspec-2se). The action says that whenever the session ends in an error, and it hides the
# error itself, even in debug mode. There were two causes, and only the Anthropic console showed
# either. First, the federation rule matched a name-only subject, which GitHub no longer issues here
# (authentication history: `match_subject_prefix`). Then the organisation had no API credit, so the
# first request made with a valid token failed at no cost. A replayed token (`jti_reused`) was
# suspected in between, and the authentication history ruled it out. NEEDS below states both.
#
# WHAT ELSE IT WOULD LET THROUGH IF IT WERE WRONG. Written 2026-09-25 (asdlc-openspec-mi6), before the
# first run. Two runs merging at once would each judge a base the other was about
# to move; a pending run cancelled by a newer one would leave its pull request unreviewed until the
# schedule; and a job that checked out a pull request's head would run that pull request's code with
# this workflow's token. So every run that reviews or merges shares one concurrency group whose
# pending runs queue rather than cancel; a run takes one action and re-dispatches itself while more
# are waiting; every job checks out the trunk and reads a pull request only as data; and the job that
# runs Claude Code holds a read-only token and no tool that writes, while the job that merges cannot
# reach Anthropic at all: it has neither `id-token: write` nor the identity's secrets.
#
# INVOCATION. It runs on its triggers. By hand, `gh workflow run pr-review.yml` wakes the queue, and
# `gh workflow run pr-review.yml -f pr=<number>` reviews that pull request again at its head.
# `node scripts/pr-review.mjs next --dry-run`, from any checkout with `gh`, prints what a run would do
# and writes nothing. No job here marks a new head pending: the session that opens a pull request
# does (`.claude/skills/open-pr/SKILL.md` § 5. Push, open, and mark it pending), and a person can:
#
#     PR=<number> node scripts/pr-review.mjs mark
#
# The queue reviews a head that passed `verify` whether or not it was marked. The `mark` job that did
# it on every new head was retired on 2026-09-28 (asdlc-openspec-08a).
#
# NEEDS. An Anthropic federation rule that accepts this workflow's OIDC token when it runs on `main`,
# with audience `https://api.anthropic.com`. While the repository's `use_immutable_subject` is on,
# GitHub issues the subject with the owner's and the repository's ids,
# `repo:<owner>@<owner id>/<repo>@<repo id>:ref:refs/heads/main`, and a rule written for
# `repo:<owner>/<repo>:...` refuses it; `gh api repos/{owner}/{repo}/actions/oidc/customization/sub`
# prints this repository's prefix. The rule's ids are the Actions secrets
# ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID and
# ANTHROPIC_WORKSPACE_ID; no API key is stored anywhere. The organisation needs API credit: with
# none, the review step fails with "did not return structured_output". It also needs `bd` at the
# version `mise.toml` pins, the tracker's database, cloned read-only from this
# repository's `refs/dolt/data` over HTTPS, and the network. It reads a token, a language model and
# the network, so it is neither a pre-push job nor a `verify.yml` step
# (`CLAUDE.md` § The gate ladder): `pr-review:check` holds its wiring to the policy, and
# `pr-review:selftest` holds every decision, from those tiers.
name: pr-review

on:
  # A verify run finished: a pull request's head may now be reviewable, or `main` green for a merge.
  workflow_run:
    workflows: ['verify']
    types: [completed]
  # A person applied a label, which wakes the queue if it is the approval label. The base branch's copy
  # of this file runs, never the pull request's, and no job checks out its head.
  pull_request_target:
    types: [labeled]
  # The safety net for a wake-up that never came: a merge GitHub was still computing, say.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Review this pull request again at its head, even where it has a verdict'
        required: false
        default: ''

# Any run may review or merge, so every run shares `pr-review-queue`: one runs at a time, and
# `queue: max` keeps each pending run rather than letting the newest cancel it.
concurrency:
  group: pr-review-queue
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  select:
    # Any label but the approval one is not the queue's business.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.label.name == 'review:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      # A red or conflicting head gets its status; `main` with no verify run gets one dispatched.
      statuses: write
      actions: write
    outputs:
      action: ${{ steps.next.outputs.action }}
      pr: ${{ steps.next.outputs.pr }}
      sha: ${{ steps.next.outputs.sha }}
      more: ${{ steps.next.outputs.more }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain `mise.toml` pins, installed from `mise.lock`, of which this job runs Node and
      # gh; mise itself, the action's commit and its `sha256` are pinned as `verify.yml` says, which
      # `mise run check:toolchain` holds.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
      - id: next
        name: choose this run's one action
        run: node scripts/pr-review.mjs next
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PR: ${{ inputs.pr }}
          # A `pull_request_target` run's OIDC subject is `…:pull_request`, which a federation
          # rule pinned to `main` refuses, so such a run only merges, and hands a review to a
          # dispatch on `main`.
          EVENT_NAME: ${{ github.event_name }}

  review:
    needs: select
    if: needs.select.outputs.action == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: whatever the pull request persuades the reviewer of, this token can write nothing.
    # `id-token: write` is the one grant beyond reading, and this job alone has it: GitHub's OIDC
    # token is what the action exchanges for a short-lived Anthropic token.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}
      facts: ${{ steps.brief.outputs.facts }}
    env:
      PR: ${{ needs.select.outputs.pr }}
      SHA: ${{ needs.select.outputs.sha }}
    steps:
      # The trunk with its history: the merge base, and the reviewer's working directory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tracker's CLI, beside Node and gh, at the versions `mise.toml` pins: bd from its own
      # GitHub release, verified against the checksum `mise.lock` holds (docs/decisions.md § D-31).
      - name: install the toolchain mise.toml pins, the tracker's CLI among it
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
      # An install that left no binary fails here rather than at `bd bootstrap` (the incident in this
      # file's header), and the log shows the version the review read the tracker with.
      - name: the tracker's CLI answers, at the version mise.toml pins
        run: bd --version
        env:
          NO_COLOR: '1'
      - name: clone the tracker read-only
        run: |
          chmod 700 .beads
          bd bootstrap --yes --sandbox
        env:
          BD_SYNC_REMOTE: git+https://github.com/${{ github.repository }}.git
          NO_COLOR: '1'
      - id: brief
        name: write the brief, the diff and each changed file at the head
        run: node scripts/pr-review.mjs brief
        env:
          GH_TOKEN: ${{ github.token }}
          # The runner's temporary directory, outside the checkout: nothing there is `main`'s, and
          # neither `.gitignore` nor a `CLAUDE.md` of the pull request's applies to it.
          REVIEW_DIR: ${{ runner.temp }}/pr-review
      - id: claude
        name: review
        uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation: no API key exists to store, leak or rotate. The four ids
          # are Actions secrets, not variables or committed values, so a public log masks them.
          # An `anthropic_api_key` here would silently win over them, and `pr-review:check`
          # refuses one.
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          # The session hooks guard agents that edit; the reviewer edits nothing. Writing to the
          # prompt cache is the largest part of a review's cost, and a review lasts minutes, so it
          # writes at the five-minute lifetime, not the one-hour one at twice the input price
          # (asdlc-openspec-tvv3).
          settings: '{"disableAllHooks": true, "promptCacheTtl": "5m"}'
          prompt: >-
            Review pull request #${{ needs.select.outputs.pr }} at head commit
            ${{ needs.select.outputs.sha }}. Your brief is ${{ runner.temp }}/pr-review/brief.md.
          # The agent's own file allows exactly Read, Grep, Glob and StructuredOutput, the tool the
          # verdict's schema is answered through (the incident in `scripts/pr-review.mjs`'s header).
          # The run denies what writes or reaches out as well, so that file is not the only guard.
          claude_args: >-
            --agent pr-reviewer
            --add-dir ${{ runner.temp }}/pr-review
            --max-turns 80
            --disallowedTools Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Agent,mcp__*
            --json-schema '${{ steps.brief.outputs.schema }}'

  act:
    needs: [select, review]
    # Runs after a skipped review too (a merge needs none), and after a failed one, to record it.
    if: >-
      !cancelled() && needs.select.result == 'success'
      && needs.select.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `id-token: write` and no Anthropic identity here: the job that can merge never runs the model.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      checks: read
      # After a merge, `verify.yml` on `main`; while more is waiting, this workflow again.
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The toolchain `mise.toml` pins, as in the `select` job.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
      - name: post the verdict, set the labels and the status, and merge
        run: node scripts/pr-review.mjs act
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.select.outputs.action }}
          PR: ${{ needs.select.outputs.pr }}
          SHA: ${{ needs.select.outputs.sha }}
          MORE: ${{ needs.select.outputs.more }}
          REVIEW_RESULT: ${{ needs.review.result }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          FACTS: ${{ needs.review.outputs.facts }}
