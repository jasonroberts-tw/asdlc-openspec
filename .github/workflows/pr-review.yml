# The pull-request reviewer: on each head a pull request against `main` is given, it sets the
# `pr-review` commit status from the high-risk floor alone, and does nothing else. Off the floor the
# status passes, and once `verify` passes too, the session that opened the pull request enables
# GitHub's auto-merge, which merges it; on the floor it fails with "A person decides: …", and a person
# merges it with the ruleset's bypass (`docs/decisions.md` § D-47, amending § D-07, § D-37 and
# § D-46). `scripts/pr-review.mjs review` decides, by the `prReview*` keys of
# `tools/policy/pr-review.json`; no language model, no secret and no merge takes part.
#
# THE INCIDENT. Until 2026-10-05 (asdlc-openspec-3cp3) this workflow was the merge queue D-07 built.
# It woke on every `verify` run, on a label, on a dispatch and on a 15-minute schedule, and each run
# scanned every open pull request to choose one action, with a token that could write contents, pull
# requests, issues, statuses and actions. By then its decision was the floor alone (D-37), and of
# the 149 pull requests merged, none carried its approval label and the maintainer had merged 125
# (`gh pr list --state merged --limit 300 --json mergedBy,labels`). Runs to that day by event: 262
# workflow_run, 50 schedule, 44 pull_request_target and 13 dispatch
# (`gh run list --workflow pr-review.yml`). Before D-37 the job also held an Anthropic workload
# identity, four Actions secrets and the tracker's CLI, each with an incident of its own
# (`git log -- .github/workflows/pr-review.yml`).
#
# WHAT ELSE IT WOULD LET THROUGH IF IT WERE WRONG. GitHub merges a head once `verify` and this status
# pass, so a status set wrong merges a head no person read: one set on a head other than the one
# decided, or set by the pull request's own code. So the job checks out the trunk, the base
# branch's copy of this file runs and never the pull request's, the head is read only as git
# objects, and the job installs Node and gh and no npm package and imports only files on the floor.
# Its token reads the trunk and writes commit statuses, and nothing else: it cannot merge, label,
# comment or dispatch. A workflow that could write a status or a check would set this one green on
# its own head, which `forgeProblems` in `scripts/pr-review.mjs` refuses, in `pr-review:check` and
# in `scripts/hooks/guard-workflow-edit.mjs`; so would this file run on any other event, where a
# branch's own copy of it runs with its grant, which both refuse too. `pr-review:check` holds every line of this file.
#
# INVOCATION. It runs when a pull request against `main` is opened, reopened, made ready for review
# or pushed to. A review that did not complete runs again with `gh run rerun <run> --failed`, and
# from any checkout with `gh`, `PR=<n> SHA=<head> node scripts/pr-review.mjs review --dry-run`
# prints the status it would set and writes nothing.
#
# NEEDS. Only the run's own `github.token`, the network to GitHub, and Node and gh at the versions
# `mise.toml` pins. No job installs `bd` or an npm package. It reads a token and the network, so it is
# neither a pre-push job nor a `verify.yml` step (`CLAUDE.md` § The gate ladder): `pr-review:check`
# holds its wiring to the policy, and `pr-review:selftest` holds every decision, from those tiers.
name: pr-review
run-name: 'pr-review #${{ github.event.pull_request.number }}'

on:
  # The base branch's copy of this file runs, never the pull request's, and no step checks out its head.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

# A newer push to the same pull request supersedes a run still deciding the head before it.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Never named `pr-review`: its check run would carry the status's context, and pass when it fails.
    name: 'review #${{ github.event.pull_request.number }}'
    # A fork's head is decided by a person.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The trunk checked out, and the pull request's head fetched as git objects.
      contents: read
      # The `pr-review` status, the job's one write.
      statuses: write
    steps:
      # The trunk with its whole history, so the merge base of the pull request's head is found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node and gh, the two tools of `mise.toml` this job runs, installed from `mise.lock` and no
      # other: without `install_args` the action installs every pin, `bd` among them. mise itself,
      # the action's commit and its `sha256` are pinned as `verify.yml` says, which
      # `mise run check:toolchain` holds.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          sha256: 57ced973f968b8fbab07aa8e32bd7077d4a357e200a22356d98963c723c6de0a
          install_args: node gh
      - name: decide the head from the floor and set its status
        run: node scripts/pr-review.mjs review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
