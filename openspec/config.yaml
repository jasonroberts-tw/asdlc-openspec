# The OpenSpec CLI's project configuration. It names the schema the CLI parses changes and specs
# with, and nothing else: this repository uses the CLI for `openspec validate` and `openspec archive`
# only, and never asks it for instructions, so `context:` and `rules:` would reach no one. The rules
# for writing a proposal, a delta spec or a design live in the `change-*` skills under
# `.claude/skills/`, and the decision is `docs/decisions.md` § D-02.
schema: spec-driven
