# A heading with no blank line before it, outside front matter and fenced code: what an edit leaves
# when it inserts or renumbers an entry above a heading, as the register's D-15 heading kept on
# `main` (asdlc-openspec-m7p). `mise run vale:selftest` holds it.
extends: script
message: "Put a blank line before this heading."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  lines := text.split(scope, "\n")
  offset := 0
  front := len(lines) > 0 && lines[0] == "---"
  fence := ""
  prev := ""
  for i := 0; i < len(lines); i++ {
    line := lines[i]
    start := offset
    offset += len(line) + 1
    if front {
      if i > 0 && line == "---" { front = false }
      prev = ""
      continue
    }
    t := text.trim_left(line, " \t")
    mark := ""
    if text.has_prefix(t, "```") { mark = "`" } else if text.has_prefix(t, "~~~") { mark = "~" }
    if fence != "" {
      if mark == fence { fence = "" }
      prev = line
      continue
    }
    if mark != "" {
      fence = mark
      prev = line
      continue
    }
    if text.re_match(`^#{1,6}( |$)`, line) && i > 0 && text.trim_space(prev) != "" {
      matches = append(matches, {begin: start, end: start + len(line)})
    }
    prev = line
  }
