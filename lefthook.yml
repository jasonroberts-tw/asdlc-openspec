# The hook runner's configuration: the pre-commit and pre-push tiers of the gate ladder
# (`CLAUDE.md` § The gate ladder). `.github/workflows/verify.yml` runs every gate again; a slower tier never trusts a
# faster one.
#
# kit 1.6-3 · ADAPT: every cost note below that gives a figure was measured on the kit author's
# host, and says so. Re-measure on yours (`time npm run
# <name>`) and replace the note, naming the host: the same job costs several times more behind
# endpoint security on native Windows than on Linux. Delete this paragraph when done.

pre-commit:
  # `parallel: false` IS DELIBERATE. With `parallel: true` the runner hangs on Windows after every
  # job has finished: it never prints its summary or returns, and only killing the process helps
  # (evilmartians/lefthook#1256, open; measured on 2.1.10 from Windows
  # Terminal with pwsh). Disabling parallel is the only workaround the issue records. Pre-commit
  # cannot leave that to a local override file, because it would hang a bare `git commit` for
  # everyone who has not copied one, and its jobs cost seconds in sequence.
  parallel: false
  jobs:
    # Over STAGED paths only: one verifier per generator, chosen by path. A staged edit under the
    # generated root is re-derived at commit time rather than discovered at push.
    - name: generated-files-are-not-hand-edited
      glob: 'artifacts/**'
      run: node scripts/assert-not-hand-edited.mjs {staged_files}
    # NO_COLOR on every job that runs a third-party CLI is load-bearing, not cosmetic: one tool
    # probed the terminal's capabilities, exited without reading the answers, and left the
    # terminal's replies in the shell's input queue, where the shell read them as typed commands.
    #
    # The tracker's own pre-commit hook, preserved. Without this job, installing the hook runner
    # turns the issue tracker's git integration off without telling anyone.
    - name: beads
      env:
        NO_COLOR: '1'
      run: bd hooks run pre-commit

# One job per git hook the tracker owns, for the same reason as the pre-commit one above.
prepare-commit-msg:
  jobs:
    - name: beads
      env:
        NO_COLOR: '1'
      run: bd hooks run prepare-commit-msg {1} {2} {3}

post-checkout:
  jobs:
    - name: beads
      env:
        NO_COLOR: '1'
      run: bd hooks run post-checkout {1} {2} {3}

post-merge:
  jobs:
    - name: beads
      env:
        NO_COLOR: '1'
      run: bd hooks run post-merge {1}

pre-push:
  # Parallel here, because these jobs take tens of seconds together and minutes in sequence. On a
  # platform where the runner hangs in parallel, `lefthook-windows.yml` is the local override.
  parallel: true
  # RUN THIS SUITE BY HAND WITH `npm run gates`, NEVER THE BARE RUNNER.
  #
  # The runner builds a pre-push file list by diffing local against the remote, and when that list
  # is empty it skips EVERY job and exits 0, which reads exactly like a clean run. Measured once:
  # "36 jobs skipped, 0.11s, exit 0" against "36 of 36 green, ~19s". The runtime
  # is the only tell. `--force` is the sole lever, and `npm run gates` is that flag with a name.
  # It bites exactly when someone checks their work by hand: just after a push, on a freshly rebased
  # branch, or on the trunk right after a merge.
  #
  # EVERY JOB CARRIES A `glob` NAMING THE FILES WHOSE CHANGE CAN ALTER ITS VERDICT, except a job
  # that reads every tracked file or reads the tracker. A check that reads only committed files is a
  # pure function of those files, so when a push changes none of them its verdict is the one the
  # last green run gave, and `.github/workflows/verify.yml` runs every gate on the pull request regardless. `--force` runs a
  # job whether or not its glob matches, so `npm run gates` is still the whole suite.
  #
  # THE RULE FOR A GLOB: re-derive it from the script's declared inputs (the files it reads, the
  # modules it imports, the artifacts it compares, the emitter it re-runs), and when in doubt make
  # it WIDER. A too-narrow glob is a gate that silently stops running on exactly the pushes that
  # matter. With the default matcher `*` and `**` both cross `/`; the one trap is `dir/**/*.ext`,
  # which needs at least one directory between, so write `dir/**` or `dir/*.ext`.
  #
  # `run: node --run <script>` RATHER THAN `npm run <script>`: it runs the package script with
  # `node_modules/.bin` on PATH and skips the package manager's own start-up. Measured in the source
  # repository at 0.9-1.2s against 2.1-3.1s through `npm run`, about a minute of pure launcher over
  # a suite in sequence.
  #
  # DELIBERATELY ABSENT: any check that reads something outside the repository (another checkout, a
  # token, a network, a language model). It runs in neither this file nor `.github/workflows/verify.yml`, and its selftest
  # over fixtures is a job here in its place. Name each one here, with its reason, when you have one.
  #
  # A RETIRED JOB stays as a comment carrying the rule text worth keeping and the shape the job
  # would take if it came back.
  jobs:
    # Every `run:` token here and in `.github/workflows/verify.yml` resolves to a package script, and every script no job
    # invokes is declared by kind in the gate's own table. Reads three committed files and lists the
    # directories the scripts' paths and globs name; milliseconds. `tools/**`, `scripts/**` and
    # `apps/**`, the roots a script's path is read under, are in both globs: moving, renaming or
    # emptying a file a script names changes the verdict (the path and glob checks), and a push that
    # touched only that file would otherwise skip the job. The selftest's control reads those same
    # files, and `scripts/**` holds the gate itself.
    - name: check-jobs
      glob:
        - 'package.json'
        - 'lefthook.yml'
        - '.github/workflows/verify.yml'
        - 'tools/**'
        - 'scripts/**'
        - 'apps/**'
      run: node --run check:jobs
    - name: check-jobs-selftest
      glob:
        - 'package.json'
        - 'lefthook.yml'
        - '.github/workflows/verify.yml'
        - 'tools/**'
        - 'scripts/**'
        - 'apps/**'
      run: node --run check:jobs:selftest
    # Every skill and agent opens with the line CLAUDE.md requires, read out of CLAUDE.md itself, and
    # every prompt is within its word budget in `tools/policy.json`: the skills and agents, CLAUDE.md,
    # AGENTS.md, the worktree briefing template, and the string literals of each workflow. Reads
    # those and the policy; 0.08 s wall through `node --run` (`/usr/bin/time -p`, two runs) on a
    # macOS 26.7 laptop with Node 26.8.1, 2026-09-26.
    - name: check-prompts
      glob:
        - 'CLAUDE.md'
        - 'AGENTS.md'
        - '.claude/skills/**'
        - '.claude/agents/**'
        - '.claude/workflows/**'
        - '.claude/worktree-CONTEXT.md.tmpl'
        - 'tools/policy.json'
        - 'scripts/check-prompts.mjs'
      run: node --run check:prompts
    # Its refusals against a fixture tree it builds under the temporary directory, with one
    # undoctored control. Reads nothing but the gate itself.
    - name: check-prompts-selftest
      glob:
        - 'scripts/check-prompts.mjs'
      run: node --run check:prompts:selftest
    # No glob: the citations gate reads every tracked text file, so any push can change its verdict.
    - name: citations
      run: node --run citations:check
    # The citations gate held to its fixtures, and run end to end through `CITATIONS_ROOT` over a
    # synthetic git tree: nine gate runs and eighteen git calls, 1.2s wall on a macOS laptop
    # (`time npm run citations:selftest`, 2026-09-23). The glob is the gate and what it imports,
    # plus the prompt roster and CLAUDE.md, which its last cases read live.
    - name: citations-selftest
      glob:
        - 'tools/citations/**'
        - 'tools/lib/**'
        - 'CLAUDE.md'
        - 'README.md'
        - '.claude/**'
        - '.beads/formulas/**'
      run: node --run citations:selftest
    # The worktree hooks and the guard, negative-tested: each case asserts the REASON a refusal
    # reports. Also loads every command `.claude/settings.json` registers from a subdirectory and
    # from outside the checkout, through a stand-in `node` that runs no hook, so the settings file is
    # in the glob, and renders the briefing template through a scratch copy of its renderer, so both
    # are in it too. It provisions twice through a scratch copy of `scripts/new-worktree.sh`, from a
    # checkout that trails its remote, and the guard reads the approval label from
    # `tools/policy.json`, so the policy is in the glob too. About a hundred and twenty git spawns,
    # two bash runs and four renders: 7.59-7.82 s wall through `node --run` (`/usr/bin/time -p`, two
    # runs, while other worktrees ran their gates) on a macOS 26.7 laptop with Node 26.8.1,
    # 2026-09-26, so re-measure it on your host before trusting the suite's total.
    - name: worktree-hooks
      glob:
        - 'scripts/hooks/**'
        - 'scripts/new-worktree.sh'
        - 'scripts/render-worktree-context.mjs'
        - 'scripts/prune-worktree-branches.mjs'
        - '.claude/worktree-CONTEXT.md.tmpl'
        - '.claude/settings.json'
        - 'tools/policy.json'
      run: node --run worktree:selftest
    # The Stop and SubagentStop hook, run as the harness runs it over scratch citation trees: an
    # untracked file with a broken pointer turns its verdict to FAIL for that reason, an ignored one
    # does not, and `checkoutOf` places a linked worktree over scratch repositories; and a copy of the
    # hook in a scratch repository gates a linked worktree and reports what that worktree's own gate
    # read. The hook runs `check:jobs` over this checkout in four of its seven runs, so the glob carries
    # that gate's inputs too, the whole of `tools/`, `scripts/` and `apps/` among them. `scripts/**`
    # and `tools/**` also hold the hook and the citations gate it runs.
    # 3.35-3.43 s wall through `node --run` (`/usr/bin/time -p`, two runs, while other worktrees ran
    # their gates) on a macOS 26.7 laptop (Apple M3 Max) with Node 26.8.1, 2026-09-26: seven hook
    # runs, each two npm starts, three of them against stub gates.
    - name: gate-summary-selftest
      glob:
        - 'package.json'
        - 'lefthook.yml'
        - '.github/workflows/verify.yml'
        - 'tools/**'
        - 'scripts/**'
        - 'apps/**'
      run: node --run gate-summary:selftest
    # The register's status line, its parenthetical dates, its mechanism sentence and its summary
    # table, held to the `### D-` headings in both directions; and `CLAUDE.md`, which cites the
    # register without a bound and must not grow one. Three committed files; milliseconds.
    - name: register-status
      glob:
        - 'docs/decisions.md'
        - 'CLAUDE.md'
        - 'scripts/check-register-status.mjs'
      run: node --run check:register
    - name: register-status-selftest
      glob:
        - 'docs/decisions.md'
        - 'CLAUDE.md'
        - 'scripts/check-register-status.mjs'
      run: node --run check:register:selftest
    # Every living spec and active change under `openspec/` validated strictly by the pinned CLI,
    # every active change trial-archived into a scratch copy, every scenario and NFR requirement held
    # to a unique ID with its capability's prefix from `tools/policy.json` that no archived change
    # gave another title (never reused, within the limits the gate's header names), no retired
    # `openspec-*` skill, and every skill and agent that spells the change label held to
    # `tools/policy.json`. The lockfile is in the glob because a new CLI version can change the
    # verdict. One CLI start per run plus one per active change; measured at 0.6 s with no active
    # change, on the author's macOS host.
    - name: openspec
      glob:
        - 'openspec/**'
        - '.claude/skills/**'
        - '.claude/agents/**'
        - 'tools/policy.json'
        - 'scripts/check-openspec.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'package.json'
        - 'package-lock.json'
      run: node --run openspec:check
    # The gate's refusals against a fixture tree it builds under the temporary directory, with one
    # undoctored control. One or two CLI starts per case; measured at 15.4 s for 54 cases
    # (`/usr/bin/time -p`) on the author's macOS host on 2026-09-28, once the ID cases landed, where
    # the 16 cases before them took 4.2 s the same day.
    - name: openspec-selftest
      glob:
        - 'scripts/check-openspec.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'package.json'
        - 'package-lock.json'
      run: node --run openspec:selftest
    # Every workflow under `.claude/workflows/` run against stubbed agents: the change-build review
    # with the review sizes and red-first kinds in `tools/policy.json` (how it stops, how many skeptics
    # it sends, and what it returns), the prompt review with the policy's `promptReview*` keys (which
    # findings it refuses as below the threshold, how many skeptics judge each edit, which branches it
    # lets merge, which analyses it lets be marked read, and which findings it holds), and the
    # change-verify trace with the policy's `verifyTrace*` keys (how it matches rows to scenarios,
    # which gap each row is, which gaps skeptics judge and how many, what a run again keeps), its
    # result then rendered by the trace and pull-request-body renderers, and a stubbed fresh run by the
    # verification report's two renderers; the change-build workflow's
    # test-builder and architect, each stop and route by its reason, and the test-builder agent's tools
    # line; and refuses a workflow with no suite. Reads the workflows, the policy, the test-builder's
    # agent file and the renderers, and writes only under the temporary directory. 0.27 s wall, both of
    # two runs, through `node --run` (`/usr/bin/time -p`) on a macOS 26.7 laptop with Node 26.8.1,
    # 2026-09-29, much of it the trace renderers' four child processes; 0.60 s on 2026-09-29 with the
    # report's renderers and their cases (asdlc-openspec-j09.14).
    - name: workflows-selftest
      glob:
        - '.claude/workflows/**'
        - '.claude/agents/test-builder.md'
        - 'scripts/workflows.selftest.mjs'
        - 'scripts/render-trace.mjs'
        - 'scripts/render-pr-body.mjs'
        - 'scripts/render-verify-report.mjs'
        - 'scripts/lib/trace.mjs'
        - 'scripts/lib/verify-report.mjs'
        - 'tools/policy.json'
      run: node --run workflows:selftest
    # The pull-request reviewer's wiring: the policy's `prReview*` keys whole, and `pr-review.yml`,
    # `verify.yml` and the reviewer's agent spelling the same labels, check and agent. The reviewer
    # itself reads a token and a language model and runs only as `pr-review.yml`. 0.10 s wall
    # through `node --run` (`/usr/bin/time -p`) on a macOS 26.7 laptop (Apple M3 Max) with Node
    # 26.8.1, 2026-09-25.
    - name: pr-review-check
      glob:
        - 'scripts/pr-review.mjs'
        - 'tools/policy.json'
        - '.github/workflows/*.yml'
        - '.claude/agents/pr-reviewer.md'
      run: node --run pr-review:check
    # Every decision over fixtures built from the live policy, each asserting its reason, and the
    # wiring gate over doctored copies of the four files it reads, with an undoctored control. The
    # same files decide its verdict. 0.16 s wall on the host and date above.
    - name: pr-review-selftest
      glob:
        - 'scripts/pr-review.mjs'
        - 'tools/policy.json'
        - '.github/workflows/*.yml'
        - '.claude/agents/pr-reviewer.md'
      run: node --run pr-review:selftest
    # The calculator's scenarios, each a test named for the IDs it proves under a suite named for its
    # requirement, run by Node's own test runner over `apps/calculator/test/` through
    # `scripts/run-tests.mjs`, which also refuses a matched file that declares no test, a test whose
    # `// trace:` metadata `scripts/test-trace.mjs` refuses, and a test that reader and the runner
    # do not both see. The runner, the reader, the helper it imports and the policy it reads its
    # hash length, layers and task shape from are in the glob because they decide the verdict. The
    # manifest is in
    # the glob for three reasons: it holds the runner's file pattern, its `"type": "module"` is
    # what makes these `.js` files ES modules, and a test asserts the command `calculator:serve`
    # runs. The lockfile is in it because it pins any package a test imports, jsdom among them. The
    # server's tests bind free ports on `127.0.0.1`, in-process and in the `serve.js` processes they
    # spawn (the default port among them, while it is free), and one tries a connection to this host's own
    # address on another interface, which a host that drops it unanswered waits 0.5 s on.
    # 1.63 s wall through `node --run`, both of two runs (`/usr/bin/time -p`), on a macOS 26.7
    # laptop (Apple M3 Max) with Node 26.8.1, 2026-09-25. The same host measured 1.59-1.61 s on
    # 2026-09-24, before the runner, when the script called `node --test` directly, and 1.92-2.36 s
    # on 2026-09-28, once the runner read each file through the reader, which itself took 3.4 ms of
    # it. That host drops the connection, so 0.5 s of it is that wait.
    #
    # IN ONE GROUP, ONE JOB AFTER THE OTHER, with `thresholds-check`, which runs the same suite. Side
    # by side, one run's `[CLS-003]` found port 26680 free while the other's server was starting on
    # it, and failed on the refusal: 9 of 20 runs of `serve.test.js` two at once (10 pairs), and
    # `npm run gates` failed once for it on 2026-09-29 (asdlc-openspec-j09.10). Not `piped`, so a
    # failure of the first still runs the second. The pair adds the first job's seconds to the chain,
    # well under the selftests' twenty.
    - name: calculator-suites
      group:
        parallel: false
        jobs:
          - name: calculator-test
            glob:
              - 'apps/calculator/**'
              - 'scripts/run-tests.mjs'
              - 'scripts/test-trace.mjs'
              - 'scripts/lib/bin-path.mjs'
              - 'scripts/lib/test-dirs.mjs'
              - 'tools/policy.json'
              - 'package.json'
              - 'package-lock.json'
            run: node --run calculator:test
          # The thresholds of `tools/policy.json` held to the code the branch changes under apps/:
          # every test file run once with Node's own coverage, its changed code lines and branches
          # counted and the whole product's figures printed beside them; the changed lines of the
          # Routines mutated by StrykerJS's tap runner, a change to a test alone mutating nothing; and
          # the ratchet baseline under artifacts/thresholds/ carried from the merge base (the header
          # of scripts/check-thresholds.mjs). It reads the code and tests under apps/, the baseline,
          # the policy, the manifest's test patterns, the runner, the reader and the helpers they
          # import, and git history; the lockfile pins StrykerJS. The Commands' run,
          # `thresholds:commands:check`, is a CI step and no job here, for its cost, which that
          # header gives (`docs/decisions.md` § D-04, amendment of 2026-09-29). 1.94-1.99 s wall
          # through `node --run` (`/usr/bin/time -p`, two runs) on a macOS 26.7 laptop (Apple M3 Max,
          # 14 CPUs, so 13 Stryker workers) with Node 26.8.1, 2026-09-29, on a branch that changes no
          # line of code, the suite's run with coverage alone; 4.13-4.42 s (two runs) over a copy
          # with one Routine line changed and its 2 mutants made; and 22.99-23.11 s (two runs,
          # 2026-09-28) with all 382 of the Routines' mutants made, as a change to every Routine line
          # would.
          - name: thresholds-check
            glob:
              - 'apps/**'
              - 'artifacts/thresholds/**'
              - 'scripts/check-thresholds.mjs'
              - 'scripts/run-tests.mjs'
              - 'scripts/test-trace.mjs'
              - 'scripts/lib/bin-path.mjs'
              - 'scripts/lib/test-dirs.mjs'
              - 'tools/lib/git-env.ts'
              - 'tools/policy.json'
              - 'package.json'
              - 'package-lock.json'
            run: node --run thresholds:check
          # The calculator's tests that run at Build, its contract tests and build-time fitness
          # functions, which the build workflow's test-builder writes under
          # `apps/calculator/test/independent/build/` (the header of
          # `.claude/workflows/build-change-task.js`), every test file at any depth there, through
          # `scripts/run-tests.mjs --dir`, which passes and says so while the directory holds none.
          # The E2E tests and Verify-deferred fitness functions under `independent/verify/` run at
          # Verify, through `calculator:test:verify`, which no job runs (`scripts/check-jobs.mjs`).
          # Its glob is `calculator-test`'s, for the same reasons. In this group, after the other two,
          # because its contract tests start the server as `serve.test.js` does: beside either of them
          # it would race them for port 26680, as they raced each other (the comment above
          # `calculator-suites`). 0.07 s wall through `node --run` (`/usr/bin/time -p`, two runs) on a
          # macOS 26.7 laptop with Node 26.8.1, 2026-09-29, with no test file there yet, which is what
          # it adds to the group's chain.
          - name: calculator-test-independent
            glob:
              - 'apps/calculator/**'
              - 'scripts/run-tests.mjs'
              - 'scripts/test-trace.mjs'
              - 'scripts/lib/bin-path.mjs'
              - 'scripts/lib/test-dirs.mjs'
              - 'tools/policy.json'
              - 'package.json'
              - 'package-lock.json'
            run: node --run calculator:test:independent
    # The test runner's refusals (a matched file that declares no test, a pattern that matches no
    # file, a `--dir` that is not a directory, a test the reader refuses or does not see, one the
    # runner never registers, and a policy without the reader's keys) and its failures, against
    # fixture trees it builds under the temporary directory, with one undoctored control. Reads the
    # runner, the reader it imports and the live policy, which it copies into each tree. 0.38-0.41 s
    # wall through `node --run` (`/usr/bin/time -p`, two runs), on the host and date of the 1.63 s
    # above, 1.02-1.09 s on 2026-09-28 with the reader's eight cases added, and 0.92-0.94 s on
    # 2026-09-29 with the three `--dir` cases added, and 1.27 s on 2026-09-29 with the results and
    # the four `--name` cases (asdlc-openspec-j09.14).
    - name: tests-selftest
      glob:
        - 'scripts/run-tests.mjs'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/policy.json'
      run: node --run tests:selftest
    # The stand-in for `tests:fresh`, which runs `npm ci` and so reads the network (docs/decisions.md
    # § D-15, item 3): the verifier's fresh run over a fixture repository it builds with git and the
    # trace gate, `npm ci` stubbed, asserting the clone is of HEAD with the checkout's origin/main and
    # no remote and is removed, each refusal by its reason, the join to the record, the tasks'
    # partition and the one re-run by name. Reads the script and the files it copies into the fixture.
    # 8.82-8.87 s wall through `node --run` (`/usr/bin/time -p`, two runs) on a macOS laptop (Apple M3
    # Max) with Node 26.8.1, 2026-09-29, most of it a clone, a test run and a trace check per case.
    - name: tests-fresh-selftest
      glob:
        - 'scripts/fresh-run.mjs'
        - 'scripts/run-tests.mjs'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/trace/**'
        - 'tools/lib/**'
        - 'tools/policy.json'
      run: node --run tests:fresh:selftest
    # The test-trace reader's refusals, each on a doctored copy of a test file's source, and its
    # hash over a fixture spec tree: the definition's text, what moves a hash and what does not, the
    # delta that wins, the refused references, the root override, `cite` refusing a ref no trace
    # line carries, and one archive by the pinned OpenSpec CLI that must move no hash. Reads the
    # reader, the live policy and the CLI, whose version the manifest and lockfile pin. 0.72-0.73 s
    # wall through `node --run` (`/usr/bin/time -p`, two runs) on the host above, 2026-09-28.
    - name: tests-trace-selftest
      glob:
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'tools/policy.json'
        - 'package.json'
        - 'package-lock.json'
      run: node --run tests:trace:selftest
    # The traceability record re-derived and diffed, and the rules its header holds: rules 5 to 8,
    # every scenario's happy-path and negative test, IDs that resolve, hashes that are current, and
    # the ratchet baseline against the one at the branch's merge base with origin/main. It reads the
    # specs, the tests, contracts and Binding Surfaces under apps/, everything under artifacts/trace/,
    # the policy, the manifest's test patterns and `--dir` directories, the reader and the helpers
    # it imports, and git history: a commit that changes the record's tasks changes a path under
    # apps/, which the glob holds. The lockfile pins the OpenSpec CLI it trial-archives an active
    # change with. 0.31-0.33 s wall through `node --run` (`/usr/bin/time -p`, two runs) on a macOS
    # 26.7 laptop with Node 26.8.1, 2026-09-28, with no active change, so no CLI start.
    - name: trace-check
      glob:
        - 'openspec/**'
        - 'apps/**'
        - 'artifacts/trace/**'
        - 'tools/trace/**'
        - 'tools/lib/**'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/policy.json'
        - 'package.json'
        - 'package-lock.json'
      run: node --run trace:check
    # The trace gate's refusals, each on a doctored copy of a fixture repository it builds under the
    # temporary directory with the live policy copied in, asserting the reason, beside a control; the
    # baseline's update; the history walk against its ratified fixture; and the command line through
    # TRACE_ROOT. Eight trial archives of an active change by the pinned CLI, two in each of four
    # cases.
    # 12.01-12.53 s wall for its 49 cases through `node --run` (`/usr/bin/time -p`, two runs, while
    # other worktrees ran) on the host and date above, most of it git and CLI starts; the jobs run
    # in parallel. 13.87-14.48 s (two runs, 2026-09-29) for 50, with a test under a `--dir`.
    - name: trace-selftest
      glob:
        - 'tools/trace/**'
        - 'tools/lib/**'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/policy.json'
        - 'package.json'
        - 'package-lock.json'
      run: node --run trace:selftest
    # No test removed, skipped or weakened on this branch without an architect decision recorded in
    # a commit's trailer: the tests at HEAD against the tests at its merge base with origin/main,
    # read from git through the reader. No glob: its verdict also turns on the branch's commit
    # messages and on where origin/main is, which no file glob sees, so a push that only rewords a
    # commit, dropping a trailer, must run it too. Seven git processes; 0.19-0.21 s wall
    # (`/usr/bin/time -p`, one run through `node --run` and one through `node`) on a macOS 26.7
    # laptop with Node 26.8.1, 2026-09-28, over 75 tests at each commit.
    - name: tests-inventory
      run: node --run tests:inventory:check
    # The gate's refusals: in-process over doctored copies of a fixture's test files, and through
    # git over fixture repositories under the temporary directory, a shallow clone and one with no
    # origin/main among them, with undoctored controls and one run of the CLI through
    # TEST_INVENTORY_ROOT. Reads the gate, the reader it imports and the helper that imports, the
    # helper that reads a script's `--dir`, the helper that strips a hook's GIT_* keys, and the live
    # policy's trailer key. 49 cases: 2.31-2.33 s wall through `node --run` (`/usr/bin/time -p`, two
    # runs) on the host above, 2026-09-28; 51, with the two `--dir` cases: 2.71-2.77 s, 2026-09-29.
    - name: tests-inventory-selftest
      glob:
        - 'scripts/check-test-inventory.mjs'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/lib/git-env.ts'
        - 'tools/policy.json'
      run: node --run tests:inventory:selftest
    # The gate's refusals over a fixture repository it builds under the temporary directory, laid out
    # as the calculator is and sized from the live policy's minimum samples, each asserting its reason
    # beside two controls: coverage, the Routines' tap runs, the Commands' command runs, the baseline
    # carried through edits and its update, the reader's code lines, and the command line through
    # THRESHOLDS_ROOT. It runs the real runner, reader
    # and StrykerJS, so they and the lockfile are in the glob, with the helper that strips a hook's
    # GIT_* keys. 24.07-24.29 s wall for its 35 cases through `node --run` (`/usr/bin/time -p`, two
    # runs) on the host above, 2026-09-29, most of it twelve StrykerJS runs; 17.05-20.80 s for 33
    # before a Command's case over the mutant sample took one of them; 23.33-25.16 s (two runs, the
    # same day) for 36, with a `--dir` case.
    - name: thresholds-selftest
      glob:
        - 'scripts/check-thresholds.mjs'
        - 'scripts/run-tests.mjs'
        - 'scripts/test-trace.mjs'
        - 'scripts/lib/bin-path.mjs'
        - 'scripts/lib/test-dirs.mjs'
        - 'tools/lib/git-env.ts'
        - 'tools/policy.json'
        - 'package.json'
        - 'package-lock.json'
      run: node --run thresholds:selftest
    # Every value in the count index re-derived from the source the index names for it. No glob: a
    # key's source may be any tracked file, so any push can change its verdict. Milliseconds.
    - name: count-index
      run: node --run counts:check
    # The gate's refusals, each exercised on a doctored fixture it builds under the temporary
    # directory, with one undoctored control. Reads nothing but the gate itself.
    - name: count-index-selftest
      glob:
        - 'scripts/check-count-index.mjs'
      run: node --run counts:selftest
    # The tracker's own pre-push hook, preserved, and the label and foreign-id rules over its open
    # issues: a `repo:` label on every one, and a label `assetLabels` in `tools/policy.json` lists on
    # every one filed `discovered-from`. Neither carries a glob: both read the tracker's database, not
    # the push.
    - name: beads
      env:
        NO_COLOR: '1'
      run: bd hooks run pre-push {1} {2}
    - name: beads-check
      env:
        NO_COLOR: '1'
      run: node --run beads:check
    # The gate's refusals over a fixture export and a copy of the committed policy it writes under the
    # temporary directory, read through `BEADS_CHECK_ROOT`, each asserting its reason, with one
    # undoctored control. It runs no `bd`, so it carries a glob: the gate, the policy it copies and
    # the launcher the gate imports. 0.63-0.64 s wall through `node --run` (`/usr/bin/time -p`, two
    # runs) on a macOS 26.7 laptop (Apple M3 Max) with Node 26.8.1, 2026-09-26.
    - name: beads-selftest
      glob:
        - 'scripts/check-beads.mjs'
        - 'tools/policy.json'
        - 'tools/lib/bd-launcher.ts'
      run: node --run beads:selftest
