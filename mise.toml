# The one home of every tool version this repository installs (docs/decisions.md § D-31). CI's
# `jdx/mise-action`, the dev container's image and README.md § Setup each install from this file
# through `mise.lock`, and nothing else states a version it pins. `mise run check:toolchain` holds
# that: each pin exact, each in the lockfile for every platform `toolchainLockPlatforms` in
# tools/policy/tool-settings.json names, and no second install of any of them. After a change here,
# run `mise install`, which records a new or moved pin in the lock, then `mise lock --platform` with
# that list, comma-separated, and commit both files and `.mise/locks/`.
#
# Not here, each on purpose: Git, a system prerequisite whose floor scripts/git-hooks.mjs holds;
# Claude Code, which updates itself; the npm packages, which package.json and its lockfile pin; and
# the tasks, which `tasks.toml` holds, so that a task's edit is not an edit to this file
# (docs/decisions.md § D-35). `check:jobs` refuses a task defined here.

# The oldest mise that reads this file as written. Every workflow's `jdx/mise-action` and the dev
# container's image pin one mise, no older than this, and `mise run check:toolchain` holds the three.
min_version = "2026.10.0"

[tools]
# Node, the line every machine runs. 24 is the line CI already ran (24.21.0 on 2026-09-23), chosen
# by the maintainer on 2026-10-03 (docs/decisions.md § D-31). package.json `engines` starts at this
# version, so every gate runs the floor (docs/decisions.md § D-34); a bump here leaves the floor
# below the pin, unexercised again, unless the same change raises `engines`. Re-derive with
# `mise latest node@24`.
node = "24.21.0"
# Python 3, for the harness assessment's graph half, which `harness:selftest` runs
# (docs/decisions.md § D-26). 3.12 is the minor line CI pinned before mise. Re-derive with
# `mise latest python@3.12`.
python = "3.12.15"
# Vale, the prose linter the vale@agent-tools plugin runs on every edit of prose, and that
# `vale:selftest` runs: the release the `Layout` style was synced and checked against on the
# maintainer's machine on 2026-09-30.
vale = "3.23.0"
# bd, the tracker's CLI, at the release that owns the tracker's database schema, so no machine runs
# an older client against a newer database. Re-derive from `bd version` on the maintainer's machine.
# Not in mise's registry, so it comes from the project's own GitHub releases.
"github:gastownhall/beads" = "1.3.0"
# gh: every pull request here is `gh pr create --base main`, and the reviewer's workflow and the
# worktree sweep call it too. The newest release on 2026-10-03.
gh = "2.102.0"
# uv, which installs the PyPI tool below and locks its dependencies. The newest release on
# 2026-10-03 (`mise latest uv`).
uv = "0.12.22"
# graphify, with its MCP extra, which `npm run code-graph` builds the local code graph with and
# serves it through (docs/decisions.md § D-20). The script refuses a `graphify --version` other than
# this pin. It is pinned because the script relies on this release's behaviour, read from its source
# on 2026-10-01: the `claude-cli` backend and `GRAPHIFY_CLAUDE_CLI_MODEL`, the text of its
# partial-extraction warnings, and the file types in `graphifySemanticExtensions` in
# tools/policy/tool-settings.json. Moving it means checking those against the new release and the
# script's header first; for `GRAPHIFY_ERODING` and `GRAPHIFY_HELP` in scripts/hooks/guard-git.mjs,
# how graphify reads its command, which commands rebuild through `update`'s path, and its help
# guard; and, for the loader check the header of tools/harness/graph.py describes, graphify's
# private `graphify.serve._load_graph` (docs/decisions.md § D-26). Moved without that check, a
# reworded warning, a new file type or a new eroding command gets through unseen, and a renamed
# loader turns that check into a skip. Where it loses: a graphify fix, such as one to the
# `graphify update` erosion D-20 records, reaches nobody here until someone moves this. `mise lock`
# locks its dependencies in a uv lock under `.mise/locks/`, resolved for every Python from 3.10, so
# a dependency can sit at an older release than an unlocked install under 3.12 would pick
# (asdlc-openspec-8juz.1, question 7).
"pypi:graphifyy" = { version = "0.9.73", extras = ["mcp"] }

[settings]
# A shim whose pinned tool is not installed fails and names `mise install`, rather than run what
# the system has under that name. With mise's default, a missing pin ran the system's Node and said
# nothing (asdlc-openspec-8juz.1, question 6). For the same reason auto-install keeps mise's
# default: turned off, it ran the system's Node too, while left on it installs a moved pin at its
# next use. A shim installs its own tool, and `mise run` every missing pin before any task, failing
# the task when one cannot install, offline among the causes. `task.run_auto_install` keeps mise's
# default too: turned off, in a fixture the review of asdlc-openspec-8juz.6 built on 2026-10-04, a
# task ran the system's `jq` in place of a `jq` newly pinned and never installed, which has no shim
# yet (docs/decisions.md § D-35).
not_found_system_fallback = false
# A task prints only what its command prints: no `[<task>]` prefix, no echo of the command and no
# timing, so `mise run <task>` writes what `node --run <task>` wrote, byte for byte; a failing task
# adds one line, `[<task>] ERROR task failed`, on stderr (asdlc-openspec-8juz.1, question 4).
task.output = "interleave"
task.quiet = true
task.timings = false

[task_config]
# A task runs in the directory `mise run` is called from. mise reads every config from the working
# directory up, so in a worktree under `.claude/worktrees/` a task the worktree's `tasks.toml` lacks
# resolves to the primary checkout's: without this line it ran there, and a gate passed on the
# wrong tree (asdlc-openspec-8juz.1, question 1). With it, such a task runs against the worktree's
# own files, and `runTask` in scripts/hooks/_shared.mjs refuses one before mise sees it.
dir = "{{cwd}}"
# The one file the tasks come from.
includes = ["tasks.toml"]
